<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Pantry Shelf</title>
<style>
  :root{
    --paper:#F7F3EC;
    --card:#FFFFFF;
    --ink:#2B2A25;
    --ink-soft:#6E6A5E;
    --line:#E4DDCC;
    --pantry:#5B6B4F;
    --pantry-soft:#EAEFE4;
    --freezer:#3D6E86;
    --freezer-soft:#E4EEF2;
    --tag:#B5542A;
    --tag-soft:#F7E4D7;
    --household:#6B5B7A;
    --household-soft:#EFE9F2;
    --opened:#8A6D1D;
    --opened-soft:#F3ECD9;
    --danger:#B33F3F;
    --danger-soft:#F6D9D9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  header{
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:18px 16px 14px;
    position:sticky;
    top:0;
    z-index:10;
  }
  h1{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-size:26px;
    font-weight:600;
    margin:0 0 10px;
  }
  .search{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:15px;
    color:var(--ink);
    outline:none;
  }
  .search:focus{border-color:var(--pantry);}
  .chips{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .chip{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    padding:7px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    user-select:none;
  }
  .chip.active[data-scope="all"]{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip.active[data-scope="pantry"]{background:var(--pantry);color:#fff;border-color:var(--pantry);}
  .chip.active[data-scope="freezer"]{background:var(--freezer);color:#fff;border-color:var(--freezer);}
  .chip.active[data-scope="fridge"]{background:var(--tag);color:#fff;border-color:var(--tag);}
  .chip.active[data-scope="household"]{background:var(--household);color:#fff;border-color:var(--household);}
  .sync-status{
    font-size:11.5px;
    font-weight:600;
    margin-top:8px;
    display:inline-flex;
    align-items:center;
    gap:5px;
    color:var(--ink-soft);
  }
  .sync-status .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);}
  .sync-status.ok{color:var(--pantry);}
  .sync-status.ok .dot{background:var(--pantry);}
  .sync-status.saving{color:var(--freezer);}
  .sync-status.saving .dot{background:var(--freezer);}
  .sync-status.error{color:var(--tag);}
  .sync-status.error .dot{background:var(--tag);}
  main{padding:14px 16px 0;}
  .actions-bar{margin-bottom:14px;}
  .actions-toggle{
    display:inline-flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    user-select:none;
  }
  .actions-toggle .chevron{
    font-size:11px;
    display:inline-block;
    transition:transform 0.15s ease;
  }
  .actions-toggle .chevron.open{transform:rotate(180deg);}
  .actions-menu{
    display:none;
    flex-direction:column;
    gap:6px;
    margin-top:8px;
    padding:8px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
  }
  .actions-menu.open{display:flex;}
  .actions-menu-item{
    text-align:left;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .actions-menu-item:hover{background:var(--card);}
  .content-divider{
    border-top:1px solid var(--line);
    margin:6px 0 20px;
  }
  .meals-block{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-bottom:22px;
  }
  .meals-title{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:5px 10px 4px;
    border-radius:3px;
    margin:0 0 10px;
    cursor:pointer;
    background:var(--pantry-soft);
    color:var(--pantry);
    list-style:none;
  }
  .meals-title::-webkit-details-marker{display:none;}
  .meals-title .chevron{
    font-size:10px;
    display:inline-block;
    transition:transform 0.15s ease;
  }
  .meals-block[open] .meals-title .chevron{transform:rotate(180deg);}
  .meal-card{
    padding:10px 0;
    border-top:1px solid var(--line);
  }
  .meal-card:first-of-type{border-top:none;}
  .meal-day{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .meal-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .meal-name-label{
    flex:1;
    min-width:0;
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
    padding:6px 0;
    white-space:pre-wrap;
    overflow-wrap:break-word;
    line-height:1.35;
  }
  .meal-name-label.cooked{text-decoration:line-through;color:var(--ink-soft);}
  .meal-cooked-label{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    color:var(--ink-soft);
    flex-shrink:0;
    user-select:none;
    cursor:pointer;
    padding-top:8px;
  }
  .meal-cooked-label input{accent-color:var(--pantry);width:16px;height:16px;}
  .recipe-toggle-row{margin-top:4px;display:flex;flex-wrap:wrap;gap:14px;}
  .recipe-link{
    border:none;
    background:none;
    color:var(--pantry);
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    padding:2px 0;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .meal-recipe{
    margin:8px 0 0;
    padding:10px 12px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    font-size:13.5px;
    line-height:1.5;
  }
  .meal-recipe-empty{color:var(--ink-soft);font-style:italic;}
  .meal-servings{font-weight:700;margin-bottom:6px;}
  .meal-last-cooked{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .meal-recipe-subtitle{
    font-weight:700;
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:8px 0 4px;
  }
  .meal-recipe-subtitle:first-child{margin-top:0;}
  .meal-ingredients, .meal-steps{margin:0;padding-left:20px;}
  .meal-ingredients li, .meal-steps li{margin-bottom:3px;}
  .meal-extra-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:8px;
  }
  .hit-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:none;
    background:none;
    padding:0;
    font-size:19px;
    line-height:1;
    cursor:pointer;
    filter:grayscale(1);
    opacity:0.45;
  }
  .hit-btn.active{filter:none;opacity:1;}
  .tag-link{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    text-decoration:underline;
    text-underline-offset:2px;
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
  }
  .meal-note-display{
    font-size:12.5px;
    color:var(--ink-soft);
    font-style:italic;
    margin-top:8px;
    line-height:1.5;
    cursor:pointer;
  }
  .meal-note-edit{margin-top:10px;}
  .meal-note-edit textarea{
    width:100%;
    min-height:60px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px;
    font-size:13px;
    font-family:inherit;
    color:var(--ink);
    background:var(--paper);
    resize:vertical;
    box-sizing:border-box;
  }
  .meal-note-edit-actions{display:flex;gap:8px;margin-top:8px;}
  .meal-btn{
    border:1px solid var(--pantry);
    background:var(--pantry);
    color:#fff;
    font-size:12.5px;
    font-weight:700;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
  }
  .meal-btn.secondary{
    background:var(--card);
    color:var(--ink-soft);
    border-color:var(--line);
  }
  .ing-checklist{
    margin:8px 0 0;
    padding:10px 12px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
  }
  .ing-hint{font-size:12px;color:var(--ink-soft);margin-bottom:10px;line-height:1.4;}
  .ing-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 0;
    border-top:1px solid var(--line);
  }
  .ing-row:first-of-type{border-top:none;padding-top:0;}
  .ing-row.done{opacity:0.55;}
  .ing-check{
    margin-top:3px;
    width:18px;
    height:18px;
    flex-shrink:0;
    accent-color:var(--pantry);
    cursor:pointer;
  }
  .ing-check:disabled{cursor:not-allowed;}
  .ing-body{flex:1;min-width:0;}
  .ing-text{font-size:13.5px;line-height:1.4;}
  .ing-text.done{text-decoration:line-through;color:var(--ink-soft);}
  .ing-meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:5px;
    font-size:12px;
    color:var(--ink-soft);
  }
  .ing-amt-input{
    width:44px;
    text-align:center;
    font-variant-numeric:tabular-nums;
    font-weight:700;
    font-size:13px;
    font-family:inherit;
    color:var(--ink);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:2px;
  }
  .ing-picker{
    width:100%;
    max-width:340px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px;
    margin-top:2px;
  }
  .ing-search-input{
    width:100%;
    box-sizing:border-box;
    font-size:13px;
    font-family:inherit;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 8px;
  }
  .ing-search-results{
    margin-top:6px;
    max-height:160px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .ing-search-option{
    text-align:left;
    font-size:12.5px;
    font-family:inherit;
    color:var(--ink);
    background:transparent;
    border:1px solid transparent;
    border-radius:6px;
    padding:5px 7px;
    cursor:pointer;
  }
  .ing-search-option:hover{background:var(--paper);border-color:var(--line);}
  .ing-search-hint{font-size:12px;color:var(--ink-soft);padding:5px 7px;}
  .ing-unmatched{color:var(--danger);font-weight:600;}
  .ing-actions{display:flex;gap:8px;margin-top:10px;}
  .section-block{margin-top:22px;}
  .shelf-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:5px 10px 4px;
    border-radius:3px;
    margin-bottom:9px;
  }
  .shelf-tag.pantry{background:var(--pantry-soft);color:var(--pantry);}
  .shelf-tag.freezer{background:var(--freezer-soft);color:var(--freezer);}
  .shelf-tag.fridge{background:var(--tag-soft);color:var(--tag);}
  .shelf-tag.household{background:var(--household-soft);color:var(--household);}
  .category-title{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 8px;
  }
  .category-group{margin-bottom:18px;}
  .category-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    user-select:none;
    margin-bottom:8px;
  }
  .category-header .category-title{margin-bottom:0;}
  .category-chevron{
    font-size:11px;
    color:var(--ink-soft);
    transition:transform 0.2s ease;
    flex-shrink:0;
    padding:4px 6px;
  }
  .category-chevron.collapsed{transform:rotate(-90deg);}
  .expiry-banner{
    background:#FBE3D8;
    border:1px solid #E8B7A0;
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:16px;
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .expiry-banner .icon{
    font-size:18px;
    line-height:1.3;
    flex-shrink:0;
  }
  .expiry-banner .body{flex:1;}
  .expiry-banner .title{
    font-weight:700;
    font-size:13.5px;
    color:#8A3A1E;
    margin-bottom:3px;
  }
  .expiry-banner .list{
    font-size:12.5px;
    color:#7A4530;
    line-height:1.5;
  }
  ul.items{list-style:none;margin:0;padding:0;}
  li.item{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:7px;
  }
  li.item.zero{opacity:0.45;}
  .item-main{
    display:flex;
    flex-direction:column;
    gap:5px;
    min-width:0;
    flex:1;
    padding-top:2px;
  }
  .item-name{font-size:14.5px;line-height:1.3;}
  .item-tags{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px;
  }
  .tag-pill{
    display:inline-flex;
    align-items:center;
    font-size:11px;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    font-family:inherit;
  }
  .tag-pill.purchased{background:var(--tag-soft);color:var(--tag);}
  .tag-pill.opened{background:var(--opened-soft);color:var(--opened);}
  .tag-pill.exp-ok{background:var(--pantry-soft);color:var(--pantry);}
  .tag-pill.exp-soon{background:#FCEBD5;color:#B5542A;}
  .tag-pill.exp-over{background:var(--danger-soft);color:var(--danger);}
  .tag-pill-link{
    display:inline-flex;
    align-items:center;
    font-size:11px;
    font-weight:600;
    color:var(--ink-soft);
    background:none;
    border:none;
    text-decoration:underline;
    text-underline-offset:2px;
    cursor:pointer;
    padding:3px 0;
    font-family:inherit;
  }
  .date-editor{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
  }
  .date-editor input[type=date]{
    border:1px solid var(--line);
    border-radius:6px;
    padding:4px 6px;
    font-size:12.5px;
    font-family:inherit;
    color:var(--ink);
    background:var(--paper);
  }
  .date-editor-btn{
    border:1px solid var(--pantry);
    background:var(--pantry);
    color:#fff;
    font-size:11.5px;
    font-weight:700;
    padding:5px 9px;
    border-radius:6px;
    cursor:pointer;
  }
  .date-editor-btn.secondary{
    background:var(--card);
    color:var(--ink-soft);
    border-color:var(--line);
  }
  .item-controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:2px;
  }
  .stepper button{
    width:28px;
    height:28px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--paper);
    font-size:16px;
    line-height:1;
    color:var(--ink);
    cursor:pointer;
  }
  .qty{
    min-width:26px;
    text-align:center;
    font-variant-numeric:tabular-nums;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
  }
  .qty-input{
    width:48px;
    text-align:center;
    font-variant-numeric:tabular-nums;
    font-weight:700;
    font-size:14.5px;
    font-family:inherit;
    color:var(--ink);
    background:var(--card);
    border:1px solid var(--pantry);
    border-radius:6px;
    padding:3px 2px;
  }
  .qty-input::-webkit-outer-spin-button,
  .qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .qty-input[type=number]{-moz-appearance:textfield;}
  .remove-btn{
    border:none;
    background:none;
    color:var(--ink-soft);
    font-size:16px;
    cursor:pointer;
    padding:4px;
    line-height:1;
  }
  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    padding:50px 20px;
    font-size:14px;
  }
  .add-item-block{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-bottom:14px;
  }
  .add-item-title{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 10px;
    cursor:pointer;
  }
  .add-item-form{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .add-item-form input, .add-item-form select, .add-item-form textarea{
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 10px;
    font-size:14px;
    color:var(--ink);
    background:var(--paper);
    font-family:inherit;
  }
  .add-item-form textarea{
    width:100%;
    font-size:13.5px;
    resize:vertical;
    box-sizing:border-box;
  }
  .add-item-row{display:flex;gap:8px;min-width:0;}
  .add-item-row > *{flex:1;min-width:0;}
  .add-item-row .qty-field{flex:0 1 56px;min-width:40px;}
  .add-item-field{display:flex;flex-direction:column;gap:4px;}
  .field-label{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .category-input-wrap{position:relative;}
  .category-input-wrap input{
    width:100%;
    padding-right:26px;
    box-sizing:border-box;
    /* Always-visible caret, drawn directly on the field so it looks and
       behaves like the Section dropdown's arrow instead of a separate
       button that only rendered on hover. */
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0L5 6L10 0Z' fill='%236E6A5E'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    background-size:10px 6px;
    appearance:none;
    -webkit-appearance:none;
  }
  .add-item-form button{
    margin-top:4px;
    padding:10px;
    border-radius:8px;
    border:1px solid var(--pantry);
    background:var(--pantry);
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .bulk-update-block{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-top:14px;
    margin-bottom:24px;
  }
  .bulk-update-block summary{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
  }
  .bulk-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:10px 0;
    line-height:1.4;
  }
  ul.bulk-hint{
    padding-left:18px;
  }
  ul.bulk-hint li{
    margin-bottom:3px;
  }
  .example-box{
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    padding:9px 10px;
  }
  .example-box-title{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .add-item-form .example-box textarea{
    display:block;
    width:100%;
    border:none;
    background:none;
    padding:0;
    font-size:13.5px;
    color:var(--ink);
    font-family:inherit;
    resize:vertical;
    box-sizing:border-box;
  }
  .add-item-form .example-box textarea:focus{outline:none;}
  .bulk-update-block textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 10px;
    font-size:13.5px;
    color:var(--ink);
    background:var(--paper);
    font-family:inherit;
    resize:vertical;
    box-sizing:border-box;
  }
  .bulk-update-block button{
    margin-top:8px;
    padding:10px;
    width:100%;
    border-radius:8px;
    border:1px solid var(--pantry);
    background:var(--pantry);
    color:#fff;
    font-size:14px;

  }
  .bulk-update-block button:disabled{opacity:0.6;cursor:default;}
</style>
</head>
<body>

<header>
  <h1>Pantry Shelf</h1>
  <input class="search" id="search" type="text" placeholder="Search items…" autocomplete="off">
  <div class="chips">
    <div class="chip active" data-scope="all">All</div>
    <div class="chip" data-scope="pantry">Pantry</div>
    <div class="chip" data-scope="freezer">Freezer</div>
    <div class="chip" data-scope="fridge">Fridge</div>
    <div class="chip" data-scope="household">Household</div>
  </div>
  <div class="sync-status" id="syncStatus"><span class="dot"></span><span id="syncText">Loading…</span></div>
</header>

<main id="main"></main>

<script>
// ==== Backend connection ====
const API_URL = "https://script.google.com/macros/s/AKfycbyHdxJs_bEpXYqxNZwYqGPH58oP8C-MgKfHFzLdLW43ceSs48z4VdDDADJIPBF4IcuasA/exec";

async function apiGet(resource){
  const res = await fetch(API_URL + "?resource=" + encodeURIComponent(resource));
  if(!res.ok) throw new Error("GET " + resource + " failed: " + res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function apiPost(body){
  // Content-Type must stay text/plain — application/json triggers a CORS
  // preflight (OPTIONS request) that Apps Script Web Apps can't answer,
  // which would silently break every save. text/plain keeps this a
  // "simple request" so the browser skips preflight; the body is still
  // valid JSON and is parsed as JSON on the Apps Script side.
  const res = await fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("POST failed: " + res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

// ==== State ====
let items = [];   // [{section, category, item, qty, purchased, opened, expiration}] -- purchased/opened/expiration are "" or a YYYY-MM-DD date
let meals = [];   // [{day, meal, cooked}]  -- this week's plan only, "meal" is just a name
let recipes = [];  // [{name, servings, ingredients: [...], steps: [...], note, lastCooked, favorite}]  -- permanent library
let activeScope = "all";
let query = "";
let suppressPollUntil = 0; // skip the next poll right after a local save, to avoid a race overwriting an in-flight edit
let expandedMealDays = new Set(); // which meal recipe panels are open — persists across re-renders
let editingNoteDay = null; // which meal's note editor is open, if any (only one at a time)
let mealsExpanded = true; // whether the whole "This Week's Meals" section is open — persists across re-renders
let addItemsExpanded = false; // whether the "Add Items" section is open — persists across re-renders
let mealsImportExpanded = false; // whether "Update This Week's Meals" is open — persists across re-renders
let purchasesImportExpanded = false; // whether "Log a Grocery Purchase" is open — persists across re-renders

// Draft text for the three paste-in boxes below, held here (not just in the
// DOM) so a background poll's render() doesn't wipe out an in-progress paste
// before the person taps the submit button. render() rebuilds these
// textareas from scratch every time it runs — including on the ~20s
// background poll in loadAll(true) — so without this, anything typed or
// pasted into one of these boxes could vanish out from under you if the poll
// lands mid-paste. Each is cleared back to "" only on a successful submit.
let mealsImportDraft = "";
let purchasesImportDraft = "";
let bulkItemsDraft = "";
let actionsMenuOpen = false; // whether the "Actions" dropdown menu is open — persists across re-renders
let editingDateField = null; // {key, field} identifying the one item+field date editor open right now, if any — only one at a time, same pattern as editingNoteDay
let collapsedCategories = new Set(); // "section|category" keys currently collapsed — persists across re-renders, but not across a page reload (in-memory only, same as expandedMealDays)

// ---- Mark ingredients used ----
// All three are in-memory only (same as expandedMealDays etc.) — a fresh
// page load starts clean, which is fine since Meals itself is disposable
// and gets overwritten week to week anyway.
let openIngredientDays = new Set(); // which meals' ingredient checklist is open
let markedIngredients = {};  // markedIngredients[day][ingredientIndex] = {itemKey, amount} — already deducted this session
let manualLinks = {};        // manualLinks[day][ingredientIndex] = itemKey ("" means "explicitly no match") — overrides the auto-match below
let ingSearchOpen = new Set(); // "day|ingredientIndex" keys currently showing the pantry-item search box instead of a resolved "Linked to" line

// Which sections get which freshness badge. Purchased ("Bought Xd ago") is
// fridge-only and normally auto-set by logging a grocery purchase; Opened is
// fridge+pantry and auto-stamped when a quantity crosses from a whole number
// into a fraction; Expiration is every section and always manual. Keeping
// this as one small lookup (rather than scattering "if section === ..."
// checks everywhere) is deliberate — the old app's version of this feature
// spread its section rules across several places and that's part of what
// made it hard to follow.
const PURCHASED_SECTIONS = new Set(["fridge"]);
const OPENED_SECTIONS = new Set(["fridge", "pantry"]);

// Within Fridge/Pantry, a handful of categories are fresh perishables —
// something you buy and just use up, with no separate "unsealing" moment
// worth tracking apart from when it was bought. A bag of apples or a fresh
// chicken breast doesn't get "opened," it just starts getting eaten. This is
// a CATEGORY list, not a section list, on purpose: it's not "fridge doesn't
// track Opened," it's "these specific kinds of food don't" — a jar of
// pickles or a tub of mayo living in the fridge is still a packaged good
// with a real bought-vs-opened distinction, same as it would be in the
// pantry, so a category like that (if one gets added under Fridge later)
// still gets Opened tracking by default. Only these named categories are
// excluded; anything new falls back to being tracked, which is the safer
// default.
const OPENED_EXCLUDED_CATEGORIES = new Set([
  "produce", "meat & poultry", "dairy", "bread & tortillas", "bread & baked goods"
]);

function tracksOpened(it){
  return OPENED_SECTIONS.has(it.section) && !OPENED_EXCLUDED_CATEGORIES.has(it.category.trim().toLowerCase());
}

// The app's four browsing sections and their display labels — used for the
// filter chips, the shelf tags above each group of items, and the Section
// dropdown in Add Items. Adding a new section later just means adding it
// here (plus a matching CSS color and chip in the header markup).
const SECTIONS = ["pantry", "freezer", "fridge", "household"];
const SECTION_LABELS = {pantry: "Pantry", freezer: "Freezer", fridge: "Fridge", household: "Household"};

// How much the item-list +/- stepper buttons move qty by on each tap. Typed
// exact amounts (tapping the number itself) still accept any value.
const QTY_STEP = 0.25;

// Splits a recipe's Ingredients/Steps cell into a list. Accepts either a
// real newline between items (how early recipes were entered, e.g. via CSV
// import) or a " | " delimiter on a single line (the preferred format now —
// far easier to type into a single Sheets cell, by hand or via automation,
// since it needs no special line-break keystroke).
function linesToArray(text){
  return String(text || "").split(/\n|\s*\|\s*/).map(l => l.trim()).filter(Boolean);
}

// Parses a pasted weekly meal plan — the format Claude outputs in chat when
// it finalizes a plan. Lets a whole week get typed/pasted in from anywhere
// (a phone included) with no Sheet or backend access needed on the writing
// end at all — the page itself does the writing once this is submitted.
//   Day: Monday
//   Name: Sheet-Pan Salmon with Green Beans & Rice
//   Servings: 4
//   Ingredients:
//   - 1 lb salmon fillet
//   - 1 cup jasmine rice
//   Steps:
//   1. Preheat oven to 400°F.
//   2. Roast salmon 12-15 min until it flakes easily.
//   Note: optional tip
//   ---
//   Day: Tuesday
//   ...
// Only "Day:" and "Name:" are required per block — Servings/Ingredients/
// Steps/Note are all optional, so a block that's just a Day+Name (pointing
// at an existing recipe already in the library) leaves that recipe's row
// untouched instead of blanking it out.
function parseMealPlanText(text){
  const lines = String(text || "").split("\n").map(l => l.replace(/\r$/, ""));
  const meals = [];
  let current = null;
  let section = null; // "ingredients" | "steps" | null

  function pushCurrent(){ if(current && current.day) meals.push(current); }

  lines.forEach(rawLine => {
    const line = rawLine.trim();
    if(!line || line === "---") return;
    const m = (label) => line.toLowerCase().startsWith(label.toLowerCase() + ":");
    const valueAfter = (label) => line.slice(label.length + 1).trim();

    if(m("Day")){
      pushCurrent();
      current = {day: valueAfter("Day"), name: "", servings: "", ingredients: [], steps: [], note: ""};
      section = null;
    } else if(!current){
      // ignore stray lines before the first "Day:"
    } else if(m("Name")){
      current.name = valueAfter("Name");
    } else if(m("Servings")){
      current.servings = valueAfter("Servings");
    } else if(m("Ingredients")){
      section = "ingredients";
    } else if(m("Steps")){
      section = "steps";
    } else if(m("Note")){
      current.note = valueAfter("Note");
      section = null;
    } else if(section === "ingredients" && /^[-•]\s*/.test(line)){
      current.ingredients.push(line.replace(/^[-•]\s*/, "").trim());
    } else if(section === "steps" && /^\d+[.)]\s*/.test(line)){
      current.steps.push(line.replace(/^\d+[.)]\s*/, "").trim());
    }
  });
  pushCurrent();

  return meals;
}

// Parses a pasted grocery receipt — the format Claude outputs after reading
// a screenshot. A "Date:"/"Store:" pair applies to every item line that
// follows, until the next "Date:" line starts a new receipt (so more than
// one receipt can be pasted in at once). Each item line is single-line and
// pipe-delimited: Item | Qty | Price | Section | Category.
//   Date: 2026-08-20
//   Store: Walmart
//   Friendly Farms Milk (1 gal) | 1 | 3.55 | fridge | Dairy
//   Great Value Mayonnaise (30 fl oz) | 1 | 2.97 | pantry | Condiments & Sauces
//   Date: 2026-08-08
//   Store: ALDI
//   General Mills Cinnamon Toast Crunch | 1 | 4.39 | pantry | Cereal & Breakfast
function parsePurchasesText(text){
  const lines = String(text || "").split("\n").map(l => l.replace(/\r$/, ""));
  const purchases = [];
  let currentDate = "", currentStore = "";

  lines.forEach(rawLine => {
    const line = rawLine.trim();
    if(!line) return;
    const m = (label) => line.toLowerCase().startsWith(label.toLowerCase() + ":");
    const valueAfter = (label) => line.slice(label.length + 1).trim();

    if(m("Date")){
      currentDate = valueAfter("Date");
    } else if(m("Store")){
      currentStore = valueAfter("Store");
    } else if(line.includes("|")){
      const parts = line.split("|").map(p => p.trim());
      const [item, qty, price, section, category] = parts;
      if(item){
        purchases.push({
          date: currentDate, store: currentStore,
          item, qty: qty || "", price: price || "",
          section: (section || "").toLowerCase(), category: category || ""
        });
      }
    }
    // any other stray line (blank, unrecognized) is just ignored
  });

  return purchases;
}

function setSyncStatus(mode, text){
  const el = document.getElementById("syncStatus");
  const txt = document.getElementById("syncText");
  el.className = "sync-status " + mode;
  txt.textContent = text;
}

// ==== Loading ====
async function loadAll(isBackgroundPoll){
  if(isBackgroundPoll && Date.now() < suppressPollUntil) return;
  try{
    const [freshItems, freshMeals, freshRecipes] = await Promise.all([apiGet("items"), apiGet("meals"), apiGet("recipes")]);
    // section is matched case/whitespace-insensitively so it doesn't matter how it was typed in the sheet
    items = freshItems.map(it => ({
      section: String(it.section || "").trim().toLowerCase(),
      category: String(it.category || "").trim(),
      item: String(it.item || "").trim(),
      qty: Number(it.qty) || 0,
      purchased: String(it.purchased || "").trim(),
      opened: String(it.opened || "").trim(),
      expiration: String(it.expiration || "").trim()
    }));
    meals = freshMeals.map(m => ({
      day: m.day,
      meal: m.meal,
      cooked: String(m.cooked).trim().toLowerCase() === "true"
    }));
    recipes = freshRecipes.map(r => ({
      name: String(r.name || "").trim(),
      servings: String(r.servings || "").trim(),
      ingredients: linesToArray(r.ingredients),
      steps: linesToArray(r.steps),
      note: String(r.note || "").trim(),
      lastCooked: String(r.lastCooked || "").trim(),
      favorite: String(r.favorite).trim().toLowerCase() === "true"
    }));
    setSyncStatus("ok", "Synced");
    render();
  }catch(err){
    setSyncStatus("error", "Couldn't load — check your connection");
    if(!isBackgroundPoll) render(); // still render an empty state rather than a blank page
  }
}

// ==== Saving ====
// extraFields lets a caller also write purchased/opened/expiration in the
// same request as a qty change (or on their own, e.g. from a date editor) —
// anything not included here is left untouched on the backend.
async function saveItemQty(it, extraFields){
  setSyncStatus("saving", "Saving…");
  try{
    await apiPost(Object.assign({resource:"items", action:"upsert", section: it.section, category: it.category, item: it.item, qty: it.qty}, extraFields || {}));
    suppressPollUntil = Date.now() + 4000;
    setSyncStatus("ok", "Synced");
  }catch(err){
    setSyncStatus("error", "Save failed — try again");
  }
}

// ==== Freshness badges (Bought / Opened / Expiration) ====
function itemKey(it){
  return it.section + "|" + it.category + "|" + it.item;
}

function daysAgo(iso){
  if(!iso) return null;
  return -daysUntil(iso);
}

// Whole-day difference between today and an ISO date — negative means it's
// in the past. Shared by daysAgo (Bought/Opened badges, always past-facing),
// expInfo (Expiration badges), and getUrgentExpirations (the top-of-app
// warning banner) so there's exactly one place computing this, not three
// slightly-different copies of the same date math.
function daysUntil(iso){
  const d = new Date(iso + "T00:00:00");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((d - today) / 86400000);
}

// Whole -> fraction (e.g. 1 -> 0.75) reads as "just opened"; back to a whole
// number (used up to 0, or restocked to a round number) clears that stamp.
// Only called for items that track Opened at all (see tracksOpened) and
// only from the main item-list quantity controls — not from Add Items or
// the purchase log, where a quantity change means "new stock," not "using
// what's there."
function maybeStampOpened(it, prevQty, newQty){
  if(!tracksOpened(it)) return {};
  const wasWhole = Number.isInteger(prevQty);
  const isWhole = Number.isInteger(newQty);
  if(wasWhole && !isWhole && newQty > 0 && !it.opened){
    it.opened = new Date().toISOString().slice(0, 10);
    return {opened: it.opened};
  }
  if(!wasWhole && isWhole && it.opened){
    it.opened = "";
    return {opened: ""};
  }
  return {};
}

// ==== Mark ingredients used ====
// Reuses the exact same save path as the item-list +/- stepper (saveItemQty
// + maybeStampOpened) — deducting via a recipe is not a different kind of
// write than tapping "-" a few times, so it shouldn't have a different code
// path. That's also why there's no separate backend endpoint for this: the
// existing items/upsert call already does everything needed.

// Words that don't help distinguish a recipe ingredient line from a pantry
// item name — stripped before comparing the two.
const ING_STOPWORDS = new Set([
  "the","a","an","of","with","and","or","great","value","simply","nature",
  "organic","fresh","frozen","sliced","diced","chopped","trimmed","cooked",
  "raw","bettergoods","specialty","no","added","sugar","original","extra",
  "bag","box","jar","can","cans","carton","cartons","pouch","pouches","ct",
  "oz","ounce","ounces","lb","lbs","pound","pounds","cup","cups","tsp",
  "tbsp","large","small","medium"
]);

// Strips a plain trailing "s" (lemons -> lemon, onions -> onion) so a
// singular recipe line ("Lemon") still matches a plural pantry name
// ("Lemons Bag") without needing a real stemming library. Deliberately
// skips words ending "us"/"ss" (asparagus, hummus, swiss) so it doesn't
// mangle words that are already singular.
function ingStem(t){
  if(t.length > 3 && /s$/.test(t) && !/[us]s$/.test(t)) return t.slice(0, -1);
  return t;
}

function ingTokenize(name){
  return name.toLowerCase()
    .replace(/[^a-z0-9\s]/g, " ")
    .split(/\s+/)
    .filter(t => t.length > 1 && isNaN(Number(t)) && !ING_STOPWORDS.has(t))
    .map(ingStem);
}

// Jaccard similarity over token sets — cheap, dependency-free, good enough
// for matching a recipe line like "one 12 oz bag green beans, trimmed"
// against an Items entry like "Green Beans (fresh)".
function ingNameSimilarity(a, b){
  const ta = new Set(ingTokenize(a));
  const tb = new Set(ingTokenize(b));
  if(ta.size === 0 || tb.size === 0) return 0;
  let intersection = 0;
  ta.forEach(t => { if(tb.has(t)) intersection++; });
  const union = new Set([...ta, ...tb]).size;
  return intersection / union;
}

const ING_MATCH_MIN = 0.2; // below this, don't guess — let the person pick from the dropdown instead

// Best current Items-tab match for one recipe ingredient line, or null if
// nothing scores high enough to suggest with any confidence. This is a
// best-effort guess exactly like matching a purchase-log line to an Items
// row elsewhere in this app — never assumed to be authoritative, always
// shown so it can be corrected.
function bestItemMatch(ingredientText){
  let best = null, bestScore = 0;
  items.forEach(it => {
    const score = ingNameSimilarity(ingredientText, it.item);
    if(score > bestScore){ bestScore = score; best = it; }
  });
  if(!best || bestScore < ING_MATCH_MIN) return null;
  return best;
}

// Pulls a leading count off an ingredient line as a sensible default "used"
// amount — "2 cans white beans" -> 2, "1 lb salmon fillet" -> 1, a line with
// no leading number (e.g. "Lemon") -> 1.
function defaultIngredientAmount(text){
  const m = text.trim().match(/^(\d+(\.\d+)?)/);
  return m ? parseFloat(m[1]) : 1;
}

function markIngredientUsed(day, idx, it, amount){
  const prevQty = it.qty;
  it.qty = Math.max(0, Math.round((it.qty - amount) * 100) / 100);
  saveItemQty(it, maybeStampOpened(it, prevQty, it.qty));
  if(!markedIngredients[day]) markedIngredients[day] = {};
  markedIngredients[day][idx] = {itemKey: itemKey(it), amount};
  render();
}

function undoIngredientMark(day, idx){
  const mark = markedIngredients[day] && markedIngredients[day][idx];
  if(!mark) return;
  const it = items.find(x => itemKey(x) === mark.itemKey);
  if(it){
    const prevQty = it.qty;
    it.qty = Math.round((it.qty + mark.amount) * 100) / 100;
    saveItemQty(it, maybeStampOpened(it, prevQty, it.qty));
  }
  delete markedIngredients[day][idx];
  render();
}

function expInfo(iso){
  const diff = daysUntil(iso);
  if(diff > 3) return {text: "Exp " + iso, cls: "exp-ok"};
  if(diff > 1) return {text: "Exp in " + diff + "d", cls: "exp-soon"};
  if(diff === 1) return {text: "Exp tomorrow", cls: "exp-soon"};
  if(diff === 0) return {text: "Exp today", cls: "exp-soon"};
  return {text: "Expired " + (-diff) + "d ago", cls: "exp-over"};
}

// Items worth a top-of-app warning: anything still in stock (qty > 0) with
// an expiration date that's already passed, or landing within the next two
// days. Sorted most-urgent-first (most overdue, then soonest).
const URGENT_EXPIRATION_WINDOW_DAYS = 2;
function getUrgentExpirations(){
  const urgent = [];
  items.forEach(it => {
    if(it.qty > 0 && it.expiration){
      const diff = daysUntil(it.expiration);
      if(diff <= URGENT_EXPIRATION_WINDOW_DAYS) urgent.push({name: it.item, diff});
    }
  });
  urgent.sort((a, b) => a.diff - b.diff);
  return urgent;
}

// Sits at the very top of #main, above everything else — the Actions bar,
// This Week's Meals, the item list. Renders nothing when nothing's urgent.
function renderExpiryBanner(container){
  const urgent = getUrgentExpirations();
  if(!urgent.length) return;

  const banner = document.createElement("div");
  banner.className = "expiry-banner";

  const icon = document.createElement("div");
  icon.className = "icon";
  icon.textContent = "⚠️";
  banner.appendChild(icon);

  const body = document.createElement("div");
  body.className = "body";

  const title = document.createElement("div");
  title.className = "title";
  title.textContent = urgent.length === 1 ? "1 item needs attention" : urgent.length + " items need attention";
  body.appendChild(title);

  const list = document.createElement("div");
  list.className = "list";
  urgent.forEach((u, i) => {
    const when = u.diff < 0 ? "expired " + (-u.diff) + "d ago"
      : u.diff === 0 ? "expires today"
      : u.diff === 1 ? "expires tomorrow"
      : "expires in " + u.diff + "d";
    const b = document.createElement("b");
    b.textContent = u.name;
    list.appendChild(b);
    list.appendChild(document.createTextNode(" — " + when));
    if(i < urgent.length - 1) list.appendChild(document.createElement("br"));
  });
  body.appendChild(list);

  banner.appendChild(body);
  container.appendChild(banner);
}

// Inline date-picker editor shared by all three fields (Bought/Opened/
// Expiration) — Save writes it, Clear blanks it, Cancel just closes it.
function buildDateEditor(it, field){
  const wrap = document.createElement("div");
  wrap.className = "date-editor";

  const input = document.createElement("input");
  input.type = "date";
  input.value = it[field] || "";
  wrap.appendChild(input);

  const saveBtn = document.createElement("button");
  saveBtn.type = "button";
  saveBtn.className = "date-editor-btn";
  saveBtn.textContent = "Save";
  saveBtn.onclick = () => {
    it[field] = input.value;
    editingDateField = null;
    saveItemQty(it, {[field]: it[field]});
    render();
  };
  wrap.appendChild(saveBtn);

  if(it[field]){
    const clearBtn = document.createElement("button");
    clearBtn.type = "button";
    clearBtn.className = "date-editor-btn secondary";
    clearBtn.textContent = "Clear";
    clearBtn.onclick = () => {
      it[field] = "";
      editingDateField = null;
      saveItemQty(it, {[field]: ""});
      render();
    };
    wrap.appendChild(clearBtn);
  }

  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.className = "date-editor-btn secondary";
  cancelBtn.textContent = "Cancel";
  cancelBtn.onclick = () => { editingDateField = null; render(); };
  wrap.appendChild(cancelBtn);

  return wrap;
}

// Bought / Opened badge — both are the same shape (a colored pill once set,
// a plain "+ set" link until then), just different fields/labels/colors.
function renderDateBadge(it, field, label, pillClass){
  const key = itemKey(it);
  if(editingDateField && editingDateField.key === key && editingDateField.field === field){
    return buildDateEditor(it, field);
  }

  const value = it[field];
  const btn = document.createElement("button");
  btn.type = "button";
  if(value){
    const days = daysAgo(value);
    btn.className = "tag-pill " + pillClass;
    btn.textContent = label + " " + (days === 0 ? "today" : days + "d ago");
  } else {
    btn.className = "tag-pill-link";
    btn.textContent = "+ set " + label.toLowerCase() + " date";
  }
  btn.onclick = () => { editingDateField = {key, field}; render(); };
  return btn;
}

// Expiration badge — same tap-to-edit shape as above, but color-coded by how

function renderExpirationBadge(it){
  const key = itemKey(it);
  if(editingDateField && editingDateField.key === key && editingDateField.field === "expiration"){
    return buildDateEditor(it, "expiration");
  }

  const btn = document.createElement("button");
  btn.type = "button";
  if(it.expiration){

}

async function deleteItem(it){

  render();
  setSyncStatus("saving", "Saving…");
  try{
    await apiPost({resource:"items", action:"delete", section: it.section, category: it.category, item: it.item});
    suppressPollUntil = Date.now() + 4000;
    setSyncStatus("ok", "Synced");
  }catch(err){

  }
}

async function saveMeal(m){

    suppressPollUntil = Date.now() + 4000;

function findRecipe(name){
  const key = String(name || "").trim().toLowerCase();
  if(!key) return null;
  return recipes.find(r => r.name.toLowerCase() === key) || null;
}

// The Meals tab only ever stores a bare weekday name ("Monday", "Tuesday", …)
// since the plan is rebuilt every week — there's no year/date on the row
// itself. These helpers map that name to the actual calendar date it refers
// to *this* week, so the day label can show a real date and so ticking
// "Cooked" late (e.g. checking Monday's box on Thursday) still stamps the
// date the meal was actually scheduled for, not the day you happened to
// click the checkbox.
const MEAL_WEEKDAY_INDEX = {monday:0, tuesday:1, wednesday:2, thursday:3, friday:4, saturday:5, sunday:6};

function mondayOfThisWeek(){
  const now = new Date();
  const dow = now.getDay(); // 0=Sun..6=Sat
  const diff = (dow === 0) ? -6 : (1 - dow);
  return new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
}

// Returns a Date for the given weekday name, in the current calendar week —
// or null if the text isn't a recognized weekday (e.g. a custom day label),
// so callers can fall back to just showing/using the plain name.
function dateForMealDay(dayName){
  const offset = MEAL_WEEKDAY_INDEX[String(dayName || "").trim().toLowerCase()];
  if(offset === undefined) return null;
  const monday = mondayOfThisWeek();
  return new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + offset);
}

function formatMealDate(d){
  return d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
}

function isoDateForMealDay(dayName){
  const d = dateForMealDay(dayName);
  if(!d) return null;
  const y = d.getFullYear(), mo = String(d.getMonth() + 1).padStart(2, "0"), da = String(d.getDate()).padStart(2, "0");
  return y + "-" + mo + "-" + da;
}

// Stamps the calendar date this meal's day actually falls on this week (not
// necessarily today — see the helpers above), and remembers what Last Cooked
// was before the stamp so an uncheck (revertLastCooked, below) can put it
// back. This memory is kept on the meal object in memory only — it doesn't
// survive a page reload, since the sheet only ever stores a single Last
// Cooked value, not a history. Reverting after a reload just clears the date
// instead.
async function stampLastCooked(m){
  const mealName = m.meal.trim();
  const recipe = findRecipe(mealName);
  m.previousLastCooked = recipe ? recipe.lastCooked : "";
  // Falls back to today's date only if m.day isn't a recognized weekday name.
  const stampDate = isoDateForMealDay(m.day) || new Date().toISOString().slice(0, 10);
  try{
    await apiPost({resource:"recipes", action:"upsert", name: mealName, lastCooked: stampDate});
    if(recipe){
      recipe.lastCooked = stampDate;
      render();
    }
  }catch(err){
    // The Cooked checkbox itself already saved fine, so this stays non-blocking —
    // but surface it instead of failing silently, so a real problem is visible
    // instead of just looking like nothing happened.
    console.error("stampLastCooked failed for \"" + mealName + "\":", err);
    setSyncStatus("error", "Cooked, but Last Cooked date failed to save");
  }
}

// Undoes stampLastCooked when a meal is un-checked — restores whatever Last
// Cooked held right before it was stamped (blank, if this is the recipe's
// first-ever cook, or an earlier date if it had one).
async function revertLastCooked(m){
  const mealName = m.meal.trim();
  const prev = m.previousLastCooked !== undefined ? m.previousLastCooked : "";
  try{
    await apiPost({resource:"recipes", action:"upsert", name: mealName, lastCooked: prev});
    const recipe = findRecipe(mealName);
    if(recipe){
      recipe.lastCooked = prev;
      render();
    }
  }catch(err){
    console.error("revertLastCooked failed for \"" + mealName + "\":", err);
    setSyncStatus("error", "Un-cooked, but Last Cooked date failed to revert");
  }
  delete m.previousLastCooked;
}

// Toggles the thumbs-up "favorite" mark for a meal's recipe. Writes straight
// to the Recipes tab, so it (like the note) sticks around across visits and
// devices instead of resetting per session.
async function saveFavorite(m){
  const mealName = m.meal.trim();
  if(!mealName) return;
  const recipe = findRecipe(mealName);
  const newValue = !(recipe && recipe.favorite);
  try{
    // Write "" rather than false when un-favoriting, so the cell goes back to
    // blank instead of showing the literal text FALSE — matching how Note and
    // Last Cooked already behave when they're unset.
    await apiPost({resource:"recipes", action:"upsert", name: mealName, favorite: newValue ? true : ""});
    if(recipe){
      recipe.favorite = newValue;
    } else {
      recipes.push({name: mealName, servings:"", ingredients:[], steps:[], note:"", lastCooked:"", favorite:newValue});
    }
    render();
  }catch(err){
    console.error("saveFavorite failed for \"" + mealName + "\":", err);
    setSyncStatus("error", "Favorite mark failed to save");
  }
}

// Saves a free-text note for a meal's recipe straight to the Recipes tab's
// Note column — same field the recipe panel already reads from.
async function saveNote(m, noteText){
  const mealName = m.meal.trim();
  if(!mealName) return;
  const trimmed = noteText.trim();
  const recipe = findRecipe(mealName);
  try{
    await apiPost({resource:"recipes", action:"upsert", name: mealName, note: trimmed});
    if(recipe){
      recipe.note = trimmed;
    } else {
      recipes.push({name: mealName, servings:"", ingredients:[], steps:[], note: trimmed, lastCooked:"", favorite:false});
    }
    editingNoteDay = null;
    render();
  }catch(err){
    console.error("saveNote failed for \"" + mealName + "\":", err);
    setSyncStatus("error", "Note failed to save");
  }
}

// ==== Rendering ====
function render(){
  const main = document.getElementById("main");
  main.innerHTML = "";

  renderExpiryBanner(main);
  renderActionsBar(main);
  if(addItemsExpanded) renderAddItemForm(main);
  if(purchasesImportExpanded) renderPurchasesImport(main);
  if(mealsImportExpanded) renderMealsImport(main);

  const divider = document.createElement("div");
  divider.className = "content-divider";
  main.appendChild(divider);

  if(!query.trim()) renderMeals(main);
  renderItems(main);
}

// The "Actions" menu is a directory to the app's other modules (Add Items,
// Log a Grocery Purchase, Update This Week's Meals) — tucked away here
// instead of sitting inline as separate cards, so the page opens straight
// to This Week's Meals and the pantry list. Picking a menu item just opens
// that module's existing collapsible panel (same state vars/persistence as
// before) and scrolls to it; the menu itself closes right after.
function renderActionsBar(container){
  const bar = document.createElement("div");
  bar.className = "actions-bar";

  const toggle = document.createElement("div");
  toggle.className = "actions-toggle";
  const label = document.createElement("span");
  label.textContent = "Actions";
  toggle.appendChild(label);
  const chevron = document.createElement("span");
  chevron.className = "chevron" + (actionsMenuOpen ? " open" : "");
  chevron.textContent = "▾";
  toggle.appendChild(chevron);
  toggle.onclick = () => { actionsMenuOpen = !actionsMenuOpen; render(); };
  bar.appendChild(toggle);

  const menu = document.createElement("div");
  menu.className = "actions-menu" + (actionsMenuOpen ? " open" : "");

  const modules = [
    {label: "Add Items", blockId: "addItemsBlock", open: () => { addItemsExpanded = true; }},
    {label: "Log a Grocery Purchase", blockId: "purchasesImportBlock", open: () => { purchasesImportExpanded = true; }},
    {label: "Update This Week's Meals", blockId: "mealsImportBlock", open: () => { mealsImportExpanded = true; }}
  ];
  modules.forEach(mod => {
    const item = document.createElement("button");
    item.className = "actions-menu-item";
    item.textContent = mod.label;
    item.onclick = () => {
      mod.open();
      actionsMenuOpen = false;
      render();
      const el = document.getElementById(mod.blockId);
      if(el) el.scrollIntoView({behavior: "smooth", block: "start"});
    };
    menu.appendChild(item);
  });
  bar.appendChild(menu);

  container.appendChild(bar);
}

function renderMeals(container){
  if(meals.length === 0) return;
  const block = document.createElement("details");
  block.className = "meals-block";
  block.open = mealsExpanded;
  block.addEventListener("toggle", () => { mealsExpanded = block.open; });

  const title = document.createElement("summary");
  title.className = "meals-title";
  const titleText = document.createElement("span");
  titleText.textContent = "This Week's Meals";
  title.appendChild(titleText);
  const titleChevron = document.createElement("span");
  titleChevron.className = "chevron";
  titleChevron.textContent = "▾";
  title.appendChild(titleChevron);
  block.appendChild(title);

  meals.forEach(m => {
    const card = document.createElement("div");
    card.className = "meal-card";

    const day = document.createElement("div");
    day.className = "meal-day";
    const mealDate = dateForMealDay(m.day);
    day.textContent = mealDate ? (m.day + ", " + formatMealDate(mealDate)) : m.day;
    card.appendChild(day);

    const row = document.createElement("div");
    row.className = "meal-row";

    // Plain wrapped text, not an editable field — renaming a meal is done
    // via the "Update This Week's Meals" paste tool or directly in the
    // Sheet, not inline here.
    const nameLabel = document.createElement("div");
    nameLabel.className = "meal-name-label" + (m.cooked ? " cooked" : "");
    nameLabel.textContent = m.meal;
    row.appendChild(nameLabel);

    const label = document.createElement("label");
    label.className = "meal-cooked-label";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = m.cooked;
    checkbox.addEventListener("change", () => {
      const becomingCooked = checkbox.checked && !m.cooked;
      const becomingUncooked = !checkbox.checked && m.cooked;
      m.cooked = checkbox.checked;
      nameLabel.className = "meal-name-label" + (m.cooked ? " cooked" : "");
      saveMeal(m);
      if(becomingCooked && m.meal.trim()) stampLastCooked(m);
      if(becomingUncooked && m.meal.trim()) revertLastCooked(m);
    });
    label.appendChild(checkbox);
    label.appendChild(document.createTextNode("Cooked"));
    row.appendChild(label);

    card.appendChild(row);

    const recipe = findRecipe(m.meal);
    // "hasRecipe" covers ANY recorded info, not just full ingredients/steps —
    // otherwise a Last Cooked stamp, a favorite, or a note on a meal with no
    // full recipe attached yet would silently never show.
    const hasRecipe = !!recipe && (recipe.servings || recipe.ingredients.length > 0 || recipe.steps.length > 0 || recipe.note || recipe.lastCooked || recipe.favorite);
    const isOpen = expandedMealDays.has(m.day);

    const toggleRow = document.createElement("div");
    toggleRow.className = "recipe-toggle-row";
    const link = document.createElement("button");
    link.className = "recipe-link";
    link.textContent = isOpen ? "Hide recipe ▲" : (hasRecipe ? "View recipe ▼" : "No recipe yet ▼");
    link.onclick = () => {
      if(expandedMealDays.has(m.day)) expandedMealDays.delete(m.day);
      else expandedMealDays.add(m.day);
      render();
    };
    toggleRow.appendChild(link);

    if(recipe && recipe.ingredients.length){
      const ingOpen = openIngredientDays.has(m.day);
      const ingBtn = document.createElement("button");
      ingBtn.className = "recipe-link";
      ingBtn.textContent = ingOpen ? "Hide ingredient checklist ▲" : "Mark ingredients used ▼";
      ingBtn.onclick = () => {
        if(openIngredientDays.has(m.day)) openIngredientDays.delete(m.day);
        else openIngredientDays.add(m.day);
        render();
      };
      toggleRow.appendChild(ingBtn);
    }

    card.appendChild(toggleRow);

    if(isOpen){
      const recipeEl = document.createElement("div");
      recipeEl.className = "meal-recipe";

      if(!hasRecipe){
        const empty = document.createElement("div");
        empty.className = "meal-recipe-empty";
        empty.textContent = "No recipe saved for this meal yet.";
        recipeEl.appendChild(empty);
      } else {
        if(recipe.servings){
          const servings = document.createElement("div");
          servings.className = "meal-servings";
          servings.textContent = "Serves " + recipe.servings;
          recipeEl.appendChild(servings);
        }
        if(recipe.lastCooked){
          const last = document.createElement("div");
          last.className = "meal-last-cooked";
          last.textContent = "Last cooked: " + recipe.lastCooked;
          recipeEl.appendChild(last);
        }
        if(recipe.ingredients.length){
          const ingTitle = document.createElement("div");
          ingTitle.className = "meal-recipe-subtitle";
          ingTitle.textContent = "Ingredients";
          recipeEl.appendChild(ingTitle);
          const ul = document.createElement("ul");
          ul.className = "meal-ingredients";
          recipe.ingredients.forEach(line => {
            const li = document.createElement("li");
            li.textContent = line;
            ul.appendChild(li);
          });
          recipeEl.appendChild(ul);
        }
        if(recipe.steps.length){
          const stepsTitle = document.createElement("div");
          stepsTitle.className = "meal-recipe-subtitle";
          stepsTitle.textContent = "Steps";
          recipeEl.appendChild(stepsTitle);
          const ol = document.createElement("ol");
          ol.className = "meal-steps";
          recipe.steps.forEach(line => {
            const li = document.createElement("li");
            li.textContent = line;
            ol.appendChild(li);
          });
          recipeEl.appendChild(ol);
        }
      }

      card.appendChild(recipeEl);
    }

    if(openIngredientDays.has(m.day) && recipe && recipe.ingredients.length){
      card.appendChild(renderIngredientChecklist(m, recipe));
    }

    // Thumbs-up + note — both write straight to this meal's Recipes row, so
    // they persist across visits/devices like Last Cooked already does.
    const extraRow = document.createElement("div");
    extraRow.className = "meal-extra-row";

    const isFavorite = !!(recipe && recipe.favorite);
    const hitBtn = document.createElement("button");
    hitBtn.className = "hit-btn" + (isFavorite ? " active" : "");
    hitBtn.textContent = "👍";
    hitBtn.title = isFavorite ? "Marked as a hit" : "Mark as a hit";
    hitBtn.onclick = () => saveFavorite(m);
    extraRow.appendChild(hitBtn);

    const currentNote = recipe ? recipe.note : "";
    const noteLink = document.createElement("button");
    noteLink.className = "tag-link";
    noteLink.textContent = currentNote ? "Edit note" : "+ Add note";
    noteLink.onclick = () => {
      editingNoteDay = editingNoteDay === m.day ? null : m.day;
      render();
    };
    extraRow.appendChild(noteLink);

    card.appendChild(extraRow);

    if(currentNote && editingNoteDay !== m.day){
      const noteDisplay = document.createElement("div");
      noteDisplay.className = "meal-note-display";
      noteDisplay.textContent = "“" + currentNote + "”";
      noteDisplay.onclick = () => { editingNoteDay = m.day; render(); };
      card.appendChild(noteDisplay);
    }

    if(editingNoteDay === m.day){
      const noteEdit = document.createElement("div");
      noteEdit.className = "meal-note-edit";

      const textarea = document.createElement("textarea");
      textarea.placeholder = "e.g. \"Kids loved this, but go lighter on the cumin next time.\"";
      textarea.value = currentNote;
      noteEdit.appendChild(textarea);

      const noteActions = document.createElement("div");
      noteActions.className = "meal-note-edit-actions";

      const saveNoteBtn = document.createElement("button");
      saveNoteBtn.className = "meal-btn";
      saveNoteBtn.textContent = "Save";
      saveNoteBtn.onclick = () => saveNote(m, textarea.value);
      noteActions.appendChild(saveNoteBtn);

      const cancelNoteBtn = document.createElement("button");
      cancelNoteBtn.className = "meal-btn secondary";
      cancelNoteBtn.textContent = "Cancel";
      cancelNoteBtn.onclick = () => { editingNoteDay = null; render(); };
      noteActions.appendChild(cancelNoteBtn);

      noteEdit.appendChild(noteActions);
      card.appendChild(noteEdit);
    }

    block.appendChild(card);
  });

  container.appendChild(block);
}

// Builds the expandable "Mark ingredients used" checklist for one meal card.
// Each row's checkbox is the single control for both marking used (deduct)
// and un-marking (undo) — no separate reset flow to keep track of, and no
// numeric entry required for a line unless it's actually got a resolved
// pantry item behind it.
// A searchable pantry-item picker: a text box that filters live as you
// type, plus a list of clickable results. Deliberately NOT wired through the
// app's usual render() cycle on every keystroke — that would rebuild the
// whole page and drop focus out of the input mid-type. Instead it updates
// its own small results list directly, the same way the item-list qty-input
// edits itself without a full re-render. render() only gets called once a
// result is actually clicked (onPick), since that's the point where state
// genuinely needs to propagate everywhere else.
function buildIngredientLinkPicker(itemList, onPick){
  const wrap = document.createElement("div");
  wrap.className = "ing-picker";

  const input = document.createElement("input");
  input.type = "text";
  input.className = "ing-search-input";
  input.placeholder = "Search pantry items…";
  input.autocomplete = "off";
  wrap.appendChild(input);

  const results = document.createElement("div");
  results.className = "ing-search-results";
  wrap.appendChild(results);

  const MAX_RESULTS = 25;

  function paintResults(query){
    results.innerHTML = "";
    const q = query.trim().toLowerCase();
    if(!q){
      const hint = document.createElement("div");
      hint.className = "ing-search-hint";
      hint.textContent = "Type to search " + itemList.length + " pantry items…";
      results.appendChild(hint);
      return;
    }
    const matches = itemList
      .filter(it => it.item.toLowerCase().includes(q))
      .sort((a, b) => a.item.localeCompare(b.item));
    if(matches.length === 0){
      const none = document.createElement("div");
      none.className = "ing-search-hint";
      none.textContent = "No pantry items match.";
      results.appendChild(none);
      return;
    }
    matches.slice(0, MAX_RESULTS).forEach(it => {
      const opt = document.createElement("button");
      opt.type = "button";
      opt.className = "ing-search-option";
      opt.textContent = it.item + " (" + it.qty + " in stock, " + SECTION_LABELS[it.section] + ")";
      opt.onclick = () => onPick(it);
      results.appendChild(opt);
    });
    if(matches.length > MAX_RESULTS){
      const more = document.createElement("div");
      more.className = "ing-search-hint";
      more.textContent = (matches.length - MAX_RESULTS) + " more — keep typing to narrow.";
      results.appendChild(more);
    }
  }

  input.addEventListener("input", () => paintResults(input.value));
  paintResults("");

  return wrap;
}

function renderIngredientChecklist(m, recipe){
  const wrap = document.createElement("div");
  wrap.className = "ing-checklist";

  const hint = document.createElement("div");
  hint.className = "ing-hint";
  hint.textContent = "Tick an ingredient off as you use it — it deducts from that item's stock right away. Untick to undo. Linked to the wrong pantry item? Pick a different one below.";
  wrap.appendChild(hint);

  if(!markedIngredients[m.day]) markedIngredients[m.day] = {};
  if(!manualLinks[m.day]) manualLinks[m.day] = {};
  const dayMarks = markedIngredients[m.day];
  const dayLinks = manualLinks[m.day];

  recipe.ingredients.forEach((line, idx) => {
    const already = dayMarks[idx]; // {itemKey, amount} once ticked

    const row = document.createElement("div");
    row.className = "ing-row" + (already ? " done" : "");

    const check = document.createElement("input");
    check.type = "checkbox";
    check.className = "ing-check";
    check.checked = !!already;

    const body = document.createElement("div");
    body.className = "ing-body";

    const text = document.createElement("div");
    text.className = "ing-text" + (already ? " done" : "");
    text.textContent = line;
    body.appendChild(text);

    const meta = document.createElement("div");
    meta.className = "ing-meta";

    const auto = bestItemMatch(line);
    const manualKey = dayLinks[idx];
    // Already-ticked rows are locked to whatever item was actually deducted
    // (that's what Undo needs to reverse) — otherwise a manual pick wins
    // over the auto-match, and the auto-match is the fallback.
    const linkedItem = already
      ? items.find(it => itemKey(it) === already.itemKey)
      : (manualKey !== undefined ? (manualKey ? items.find(it => itemKey(it) === manualKey) : null) : auto);

    let amtInput = null;

    if(already){
      const note = document.createElement("span");
      note.textContent = "Used " + already.amount + (linkedItem ? " — now " + linkedItem.qty + " in stock" : " (item no longer in the pantry list)");
      meta.appendChild(note);
    } else {
      const rowKey = m.day + "|" + idx;
      // Show the search picker whenever there's nothing resolved yet, or the
      // person explicitly asked to change a resolved link.
      const searching = !linkedItem || ingSearchOpen.has(rowKey);

      if(searching){
        const picker = buildIngredientLinkPicker(items, (it) => {
          dayLinks[idx] = itemKey(it);
          ingSearchOpen.delete(rowKey);
          render();
        });
        meta.appendChild(picker);

        if(linkedItem){
          // There's already a link (from auto-match or an earlier manual
          // pick) — "Change" got clicked, so offer a way back without
          // forcing a re-pick.
          const cancelBtn = document.createElement("button");
          cancelBtn.className = "tag-link";
          cancelBtn.textContent = "Cancel";
          cancelBtn.onclick = () => { ingSearchOpen.delete(rowKey); render(); };
          meta.appendChild(cancelBtn);
        } else {
          const unmatched = document.createElement("span");
          unmatched.className = "ing-unmatched";
          unmatched.textContent = "Search above and pick a pantry item to enable ticking this off.";
          meta.appendChild(unmatched);
        }
        check.disabled = true;
      } else {
        const linkedLine = document.createElement("span");
        linkedLine.textContent = "Linked to: " + linkedItem.item + " (" + linkedItem.qty + " in stock)";
        meta.appendChild(linkedLine);

        const changeBtn = document.createElement("button");
        changeBtn.className = "tag-link";
        changeBtn.textContent = "Change";
        changeBtn.onclick = () => { ingSearchOpen.add(rowKey); render(); };
        meta.appendChild(changeBtn);

        meta.appendChild(document.createTextNode("Used:"));
        amtInput = document.createElement("input");
        amtInput.type = "number";
        amtInput.className = "ing-amt-input";
        amtInput.min = "0";
        amtInput.step = "0.25";
        amtInput.value = defaultIngredientAmount(line);
        meta.appendChild(amtInput);
      }
    }

    check.onchange = () => {
      if(already){
        undoIngredientMark(m.day, idx);
        return;
      }
      if(!linkedItem){ check.checked = false; return; }
      const amt = amtInput ? parseFloat(amtInput.value) : 1;
      markIngredientUsed(m.day, idx, linkedItem, (isNaN(amt) || amt <= 0) ? 1 : amt);
    };

    body.appendChild(meta);
    row.appendChild(check);
    row.appendChild(body);
    wrap.appendChild(row);
  });

  const actions = document.createElement("div");
  actions.className = "ing-actions";
  const closeBtn = document.createElement("button");
  closeBtn.className = "meal-btn secondary";
  closeBtn.textContent = "Close";
  closeBtn.onclick = () => { openIngredientDays.delete(m.day); render(); };
  actions.appendChild(closeBtn);
  wrap.appendChild(actions);

  return wrap;
}

function renderMealsImport(container){
  const block = document.createElement("details");
  block.id = "mealsImportBlock";
  block.className = "bulk-update-block";
  block.open = mealsImportExpanded;
  block.addEventListener("toggle", () => { mealsImportExpanded = block.open; });

  const summary = document.createElement("summary");
  summary.textContent = "Update This Week's Meals";
  block.appendChild(summary);

  const hint = document.createElement("div");
  hint.className = "bulk-hint";
  hint.textContent = 'Paste the meal plan Claude gave you in chat — each day gets written straight to the sheet, no laptop needed. Format per day: "Day: Monday" then "Name: …", and optionally "Servings:", "Ingredients:" (lines starting with -), "Steps:" (lines starting with a number), and "Note:" — separate days with a line containing just "---". A day with just Day/Name (pointing at a recipe already in the library) leaves that recipe untouched.';
  block.appendChild(hint);

  const textarea = document.createElement("textarea");
  textarea.rows = 10;
  textarea.placeholder = "Day: Monday\nName: Sheet-Pan Salmon with Green Beans & Rice\nServings: 4\nIngredients:\n- 1 lb salmon fillet\n- 1 cup jasmine rice\nSteps:\n1. Preheat oven to 400°F.\n2. Roast salmon 12-15 min until it flakes easily.\nNote:\n---\nDay: Tuesday\n…";
  textarea.value = mealsImportDraft;
  textarea.addEventListener("input", () => { mealsImportDraft = textarea.value; });
  block.appendChild(textarea);

  const applyBtn = document.createElement("button");
  applyBtn.textContent = "Update meal plan";
  block.appendChild(applyBtn);

  applyBtn.onclick = async () => {
    const parsed = parseMealPlanText(textarea.value);
    if(!parsed.length){
      alert('Couldn\'t find any meals in that text — check it matches the "Day: …" / "Name: …" format and try again.');
      return;
    }

    applyBtn.disabled = true;
    for(let i = 0; i < parsed.length; i++){
      const p = parsed[i];
      applyBtn.textContent = "Updating… (" + (i + 1) + "/" + parsed.length + ")";
      setSyncStatus("saving", "Saving…");
      try{
        await apiPost({resource: "meals", action: "upsert", day: p.day, meal: p.name, cooked: false});
        const hasRecipeInfo = p.servings || p.ingredients.length || p.steps.length || p.note;
        if(p.name && hasRecipeInfo){
          const recipeBody = {resource: "recipes", action: "upsert", name: p.name};
          if(p.servings) recipeBody.servings = p.servings;
          if(p.ingredients.length) recipeBody.ingredients = p.ingredients.join(" | ");
          if(p.steps.length) recipeBody.steps = p.steps.join(" | ");
          if(p.note) recipeBody.note = p.note;
          await apiPost(recipeBody);
        }
      }catch(err){
        console.error("Meal plan import failed on \"" + p.day + "\":", err);
        setSyncStatus("error", "Import failed partway — check the sheet");
        alert("Something went wrong updating " + p.day + ": " + err.message + "\n\nDays before this one in the list were likely already saved — check the sheet before pasting again, to avoid double-writing them.");
        applyBtn.disabled = false;
        applyBtn.textContent = "Update meal plan";
        return;
      }
    }

    applyBtn.disabled = false;
    applyBtn.textContent = "Update meal plan";
    textarea.value = "";
    mealsImportDraft = "";
    suppressPollUntil = Date.now() + 4000;
    setSyncStatus("ok", "Synced");
    await loadAll();
    alert("Updated " + parsed.length + " day" + (parsed.length === 1 ? "" : "s") + ".");
  };

  container.appendChild(block);
}
