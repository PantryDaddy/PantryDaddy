<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Pantry Shelf</title>
<style>
  :root{
    --paper:#F7F3EC;
    --card:#FFFFFF;
    --ink:#2B2A25;
    --ink-soft:#6E6A5E;
    --line:#E4DDCC;
    --pantry:#5B6B4F;
    --pantry-soft:#EAEFE4;
    --freezer:#3D6E86;
    --freezer-soft:#E4EEF2;
    --tag:#B5542A;
    --tag-soft:#F7E4D7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  header{
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:18px 16px 14px;
    position:sticky;
    top:0;
    z-index:10;
  }
  h1{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-size:26px;
    font-weight:600;
    margin:0 0 10px;
  }
  .search{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:15px;
    color:var(--ink);
    outline:none;
  }
  .search:focus{border-color:var(--pantry);}
  .chips{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .chip{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    padding:7px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    user-select:none;
  }
  .chip.active[data-scope="all"]{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip.active[data-scope="pantry"]{background:var(--pantry);color:#fff;border-color:var(--pantry);}
  .chip.active[data-scope="freezer"]{background:var(--freezer);color:#fff;border-color:var(--freezer);}
  .chip.active[data-scope="fresh"]{background:var(--tag);color:#fff;border-color:var(--tag);}
  .sync-status{
    font-size:11.5px;
    font-weight:600;
    margin-top:8px;
    display:inline-flex;
    align-items:center;
    gap:5px;
    color:var(--ink-soft);
  }
  .sync-status .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);}
  .sync-status.ok{color:var(--pantry);}
  .sync-status.ok .dot{background:var(--pantry);}
  .sync-status.saving{color:var(--freezer);}
  .sync-status.saving .dot{background:var(--freezer);}
  .sync-status.error{color:var(--tag);}
  .sync-status.error .dot{background:var(--tag);}
  main{padding:14px 16px 0;}
  .meals-block{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-bottom:22px;
  }
  .meals-title{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 10px;
  }
  .meal-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-top:1px solid var(--line);
  }
  .meal-row:first-of-type{border-top:none;}
  .meal-day{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    width:70px;
    flex-shrink:0;
  }
  .meal-name-input{
    flex:1;
    border:1px solid transparent;
    background:transparent;
    font-size:14.5px;
    color:var(--ink);
    padding:6px 8px;
    border-radius:7px;
  }
  .meal-name-input:focus{border-color:var(--line);background:var(--paper);outline:none;}
  .meal-name-input.cooked{text-decoration:line-through;color:var(--ink-soft);}
  .meal-cooked-label{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    color:var(--ink-soft);
    flex-shrink:0;
    user-select:none;
    cursor:pointer;
  }
  .meal-cooked-label input{accent-color:var(--pantry);width:16px;height:16px;}
  .section-block{margin-top:22px;}
  .shelf-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:5px 10px 4px;
    border-radius:3px;
    margin-bottom:9px;
  }
  .shelf-tag.pantry{background:var(--pantry-soft);color:var(--pantry);}
  .shelf-tag.freezer{background:var(--freezer-soft);color:var(--freezer);}
  .shelf-tag.fresh{background:var(--tag-soft);color:var(--tag);}
  .category-title{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 8px;
  }
  .category-group{margin-bottom:18px;}
  ul.items{list-style:none;margin:0;padding:0;}
  li.item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:7px;
  }
  li.item.zero{opacity:0.45;}
  .item-name{font-size:14.5px;line-height:1.3;}
  .item-controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:2px;
  }
  .stepper button{
    width:28px;
    height:28px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--paper);
    font-size:16px;
    line-height:1;
    color:var(--ink);
    cursor:pointer;
  }
  .qty{
    min-width:26px;
    text-align:center;
    font-variant-numeric:tabular-nums;
    font-weight:700;
    font-size:14.5px;
  }
  .remove-btn{
    border:none;
    background:none;
    color:var(--ink-soft);
    font-size:16px;
    cursor:pointer;
    padding:4px;
    line-height:1;
  }
  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    padding:50px 20px;
    font-size:14px;
  }
  .add-item-block{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-top:24px;
  }
  .add-item-title{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 10px;
  }
  .add-item-form{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .add-item-form input, .add-item-form select{
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 10px;
    font-size:14px;
    color:var(--ink);
    background:var(--paper);
    font-family:inherit;
  }
  .add-item-row{display:flex;gap:8px;}
  .add-item-row > *{flex:1;}
  .add-item-form button{
    margin-top:4px;
    padding:10px;
    border-radius:8px;
    border:1px solid var(--pantry);
    background:var(--pantry);
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <h1>Pantry Shelf</h1>
  <input class="search" id="search" type="text" placeholder="Search items…" autocomplete="off">
  <div class="chips">
    <div class="chip active" data-scope="all">All</div>
    <div class="chip" data-scope="pantry">Pantry</div>
    <div class="chip" data-scope="freezer">Freezer</div>
    <div class="chip" data-scope="fresh">Fresh</div>
  </div>
  <div class="sync-status" id="syncStatus"><span class="dot"></span><span id="syncText">Loading…</span></div>
</header>

<main id="main"></main>

<script>
// ==== Backend connection ====
// Paste your Apps Script Web App /exec URL here (see Code.gs setup notes).
const API_URL = "https://script.google.com/macros/s/AKfycbyHdxJs_bEpXYqxNZwYqGPH58oP8C-MgKfHFzLdLW43ceSs48z4VdDDADJIPBF4IcuasA/exec";

async function apiGet(resource){
  const res = await fetch(API_URL + "?resource=" + encodeURIComponent(resource));
  if(!res.ok) throw new Error("GET " + resource + " failed: " + res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function apiPost(body){
  // Content-Type must stay text/plain — application/json triggers a CORS
  // preflight (OPTIONS request) that Apps Script Web Apps can't answer,
  // which would silently break every save. text/plain keeps this a
  // "simple request" so the browser skips preflight; the body is still
  // valid JSON and is parsed as JSON on the Apps Script side.
  const res = await fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("POST failed: " + res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

// ==== State ====
let items = [];   // [{section, category, item, qty}]
let meals = [];   // [{day, meal, cooked}]
let activeScope = "all";
let query = "";
let suppressPollUntil = 0; // skip the next poll right after a local save, to avoid a race overwriting an in-flight edit

function setSyncStatus(mode, text){
  const el = document.getElementById("syncStatus");
  const txt = document.getElementById("syncText");
  el.className = "sync-status " + mode;
  txt.textContent = text;
}

// ==== Loading ====
async function loadAll(isBackgroundPoll){
  if(isBackgroundPoll && Date.now() < suppressPollUntil) return;
  try{
    const [freshItems, freshMeals] = await Promise.all([apiGet("items"), apiGet("meals")]);
    items = freshItems.map(it => ({section: it.section, category: it.category, item: it.item, qty: Number(it.qty) || 0}));
    meals = freshMeals.map(m => ({day: m.day, meal: m.meal, cooked: m.cooked === true || m.cooked === "TRUE" || m.cooked === "true"}));
    setSyncStatus("ok", "Synced");
    render();
  }catch(err){
    setSyncStatus("error", "Couldn't load — check your connection");
    if(!isBackgroundPoll) render(); // still render an empty state rather than a blank page
  }
}

// ==== Saving ====
async function saveItemQty(it){
  setSyncStatus("saving", "Saving…");
  try{
    await apiPost({resource:"items", action:"upsert", section: it.section, category: it.category, item: it.item, qty: it.qty});
    suppressPollUntil = Date.now() + 4000;
    setSyncStatus("ok", "Synced");
  }catch(err){
    setSyncStatus("error", "Save failed — try again");
  }
}

async function deleteItem(it){
  items = items.filter(x => x !== it);
  render();
  setSyncStatus("saving", "Saving…");
  try{
    await apiPost({resource:"items", action:"delete", section: it.section, category: it.category, item: it.item});
    suppressPollUntil = Date.now() + 4000;
    setSyncStatus("ok", "Synced");
  }catch(err){
    setSyncStatus("error", "Delete failed — try again");
  }
}

async function saveMeal(m){
  setSyncStatus("saving", "Saving…");
  try{
    await apiPost({resource:"meals", action:"upsert", day: m.day, meal: m.meal, cooked: m.cooked});
    suppressPollUntil = Date.now() + 4000;
    setSyncStatus("ok", "Synced");
  }catch(err){
    setSyncStatus("error", "Save failed — try again");
  }
}

// ==== Rendering ====
function render(){
  const main = document.getElementById("main");
  main.innerHTML = "";

  if(!query.trim()) renderMeals(main);
  renderItems(main);
  renderAddItemForm(main);
}

function renderMeals(container){
  if(meals.length === 0) return;
  const block = document.createElement("div");
  block.className = "meals-block";

  const title = document.createElement("div");
  title.className = "meals-title";
  title.textContent = "This Week's Meals";
  block.appendChild(title);

  meals.forEach(m => {
    const row = document.createElement("div");
    row.className = "meal-row";

    const day = document.createElement("div");
    day.className = "meal-day";
    day.textContent = m.day;
    row.appendChild(day);

    const input = document.createElement("input");
    input.className = "meal-name-input" + (m.cooked ? " cooked" : "");
    input.type = "text";
    input.value = m.meal;
    input.addEventListener("change", () => {
      m.meal = input.value.trim();
      saveMeal(m);
    });
    row.appendChild(input);

    const label = document.createElement("label");
    label.className = "meal-cooked-label";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = m.cooked;
    checkbox.addEventListener("change", () => {
      m.cooked = checkbox.checked;
      input.className = "meal-name-input" + (m.cooked ? " cooked" : "");
      saveMeal(m);
    });
    label.appendChild(checkbox);
    label.appendChild(document.createTextNode("Cooked"));
    row.appendChild(label);

    block.appendChild(row);
  });

  container.appendChild(block);
}

function renderItems(container){
  const sections = activeScope === "all" ? ["pantry", "freezer", "fresh"] : [activeScope];
  const q = query.trim().toLowerCase();
  let totalShown = 0;

  sections.forEach(section => {
    const sectionItems = items.filter(it => it.section === section && (!q || it.item.toLowerCase().includes(q)));
    if(sectionItems.length === 0) return;

    const block = document.createElement("div");
    block.className = "section-block";

    const tag = document.createElement("div");
    tag.className = "shelf-tag " + section;
    tag.textContent = section === "pantry" ? "Pantry" : section === "freezer" ? "Freezer" : "Fresh / Fridge";
    block.appendChild(tag);

    const categories = [...new Set(sectionItems.map(it => it.category))];
    categories.forEach(category => {
      const catItems = sectionItems.filter(it => it.category === category);
      totalShown += catItems.length;

      const catWrap = document.createElement("div");
      catWrap.className = "category-group";

      const catTitle = document.createElement("div");
      catTitle.className = "category-title";
      catTitle.textContent = category;
      catWrap.appendChild(catTitle);

      const ul = document.createElement("ul");
      ul.className = "items";

      catItems.forEach(it => {
        const li = document.createElement("li");
        li.className = "item" + (it.qty === 0 ? " zero" : "");

        const name = document.createElement("div");
        name.className = "item-name";
        name.textContent = it.item;
        li.appendChild(name);

        const controls = document.createElement("div");
        controls.className = "item-controls";

        const stepper = document.createElement("div");
        stepper.className = "stepper";
        const minus = document.createElement("button");
        minus.textContent = "–";
        minus.onclick = () => { it.qty = Math.max(0, Math.round((it.qty - 1) * 100) / 100); saveItemQty(it); render(); };
        const qtyEl = document.createElement("div");
        qtyEl.className = "qty";
        qtyEl.textContent = it.qty;
        const plus = document.createElement("button");
        plus.textContent = "+";
        plus.onclick = () => { it.qty = Math.round((it.qty + 1) * 100) / 100; saveItemQty(it); render(); };
        stepper.appendChild(minus);
        stepper.appendChild(qtyEl);
        stepper.appendChild(plus);
        controls.appendChild(stepper);

        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-btn";
        removeBtn.textContent = "✕";
        removeBtn.title = "Remove item";
        removeBtn.onclick = () => {
          if(confirm('Remove "' + it.item + '" from the list entirely?')) deleteItem(it);
        };
        controls.appendChild(removeBtn);

        li.appendChild(controls);
        ul.appendChild(li);
      });

      catWrap.appendChild(ul);
      block.appendChild(catWrap);
    });

    container.appendChild(block);
  });

  if(totalShown === 0){
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = q ? "No items match your search." : "No items here yet — add one below.";
    container.appendChild(empty);
  }
}

function renderAddItemForm(container){
  const block = document.createElement("div");
  block.className = "add-item-block";

  const title = document.createElement("div");
  title.className = "add-item-title";
  title.textContent = "Add an Item";
  block.appendChild(title);

  const form = document.createElement("div");
  form.className = "add-item-form";

  const nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.placeholder = "Item name";
  form.appendChild(nameInput);

  const row = document.createElement("div");
  row.className = "add-item-row";

  const sectionSelect = document.createElement("select");
  ["pantry", "freezer", "fresh"].forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s === "pantry" ? "Pantry" : s === "freezer" ? "Freezer" : "Fresh / Fridge";
    sectionSelect.appendChild(opt);
  });
  row.appendChild(sectionSelect);

  const categoryInput = document.createElement("input");
  categoryInput.type = "text";
  categoryInput.placeholder = "Category";
  categoryInput.setAttribute("list", "categoryOptions");
  row.appendChild(categoryInput);

  const qtyInput = document.createElement("input");
  qtyInput.type = "number";
  qtyInput.min = "0";
  qtyInput.step = "1";
  qtyInput.value = "1";
  qtyInput.style.flex = "0 0 70px";
  row.appendChild(qtyInput);

  form.appendChild(row);

  const datalist = document.createElement("datalist");
  datalist.id = "categoryOptions";
  [...new Set(items.map(it => it.category))].forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    datalist.appendChild(opt);
  });
  form.appendChild(datalist);

  const addBtn = document.createElement("button");
  addBtn.textContent = "Add to pantry";
  addBtn.onclick = async () => {
    const name = nameInput.value.trim();
    const category = categoryInput.value.trim();
    if(!name || !category){
      alert("Please enter both an item name and a category.");
      return;
    }
    const newItem = {section: sectionSelect.value, category, item: name, qty: parseFloat(qtyInput.value) || 0};
    items.push(newItem);
    render();
    await saveItemQty(newItem);
  };
  form.appendChild(addBtn);

  block.appendChild(form);
  container.appendChild(block);
}

// ==== Controls ====
document.getElementById("search").addEventListener("input", (e) => {
  query = e.target.value;
  render();
});

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    activeScope = chip.dataset.scope;
    render();
  });
});

// ==== Init ====
loadAll();
setInterval(() => loadAll(true), 20000);
</script>
</body>
</html>
