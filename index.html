<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Pantry Shelf</title>
<style>
  :root{
    --paper:#F7F3EC;
    --card:#FFFFFF;
    --ink:#2B2A25;
    --ink-soft:#6E6A5E;
    --line:#E4DDCC;
    --pantry:#5B6B4F;
    --pantry-soft:#EAEFE4;
    --freezer:#3D6E86;
    --freezer-soft:#E4EEF2;
    --tag:#B5542A;
    --tag-soft:#F7E4D7;
    --household:#6B5B7A;
    --household-soft:#EFE9F2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  header{
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:18px 16px 14px;
    position:sticky;
    top:0;
    z-index:10;
  }
  h1{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-size:26px;
    font-weight:600;
    margin:0 0 10px;
  }
  .search{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:15px;
    color:var(--ink);
    outline:none;
  }
  .search:focus{border-color:var(--pantry);}
  .chips{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .chip{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    padding:7px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    user-select:none;
  }
  .chip.active[data-scope="all"]{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip.active[data-scope="pantry"]{background:var(--pantry);color:#fff;border-color:var(--pantry);}
  .chip.active[data-scope="freezer"]{background:var(--freezer);color:#fff;border-color:var(--freezer);}
  .chip.active[data-scope="fridge"]{background:var(--tag);color:#fff;border-color:var(--tag);}
  .chip.active[data-scope="household"]{background:var(--household);color:#fff;border-color:var(--household);}
  .sync-status{
    font-size:11.5px;
    font-weight:600;
    margin-top:8px;
    display:inline-flex;
    align-items:center;
    gap:5px;
    color:var(--ink-soft);
  }
  .sync-status .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);}
  .sync-status.ok{color:var(--pantry);}
  .sync-status.ok .dot{background:var(--pantry);}
  .sync-status.saving{color:var(--freezer);}
  .sync-status.saving .dot{background:var(--freezer);}
  .sync-status.error{color:var(--tag);}
  .sync-status.error .dot{background:var(--tag);}
  main{padding:14px 16px 0;}
  .actions-bar{margin-bottom:14px;}
  .actions-toggle{
    display:inline-flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    user-select:none;
  }
  .actions-toggle .chevron{
    font-size:11px;
    display:inline-block;
    transition:transform 0.15s ease;
  }
  .actions-toggle .chevron.open{transform:rotate(180deg);}
  .actions-menu{
    display:none;
    flex-direction:column;
    gap:6px;
    margin-top:8px;
    padding:8px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
  }
  .actions-menu.open{display:flex;}
  .actions-menu-item{
    text-align:left;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .actions-menu-item:hover{background:var(--card);}
  .content-divider{
    border-top:1px solid var(--line);
    margin:6px 0 20px;
  }
  .meals-block{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-bottom:22px;
  }
  .meals-title{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:5px 10px 4px;
    border-radius:3px;
    margin:0 0 10px;
    cursor:pointer;
    background:var(--pantry-soft);
    color:var(--pantry);
  }
  .meal-card{
    padding:10px 0;
    border-top:1px solid var(--line);
  }
  .meal-card:first-of-type{border-top:none;}
  .meal-day{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .meal-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .meal-name-input{
    flex:1;
    min-width:0;
    border:1px solid transparent;
    background:transparent;
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
    padding:6px 8px;
    margin-left:-8px;
    border-radius:7px;
  }
  .meal-name-input:focus{border-color:var(--line);background:var(--paper);outline:none;}
  .meal-name-input.cooked{text-decoration:line-through;color:var(--ink-soft);}
  .meal-cooked-label{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    color:var(--ink-soft);
    flex-shrink:0;
    user-select:none;
    cursor:pointer;
  }
  .meal-cooked-label input{accent-color:var(--pantry);width:16px;height:16px;}
  .recipe-toggle-row{margin-top:4px;}
  .recipe-link{
    border:none;
    background:none;
    color:var(--pantry);
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    padding:2px 0;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .meal-recipe{
    margin:8px 0 0;
    padding:10px 12px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    font-size:13.5px;
    line-height:1.5;
  }
  .meal-recipe-empty{color:var(--ink-soft);font-style:italic;}
  .meal-servings{font-weight:700;margin-bottom:6px;}
  .meal-last-cooked{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .meal-recipe-subtitle{
    font-weight:700;
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:8px 0 4px;
  }
  .meal-recipe-subtitle:first-child{margin-top:0;}
  .meal-ingredients, .meal-steps{margin:0;padding-left:20px;}
  .meal-ingredients li, .meal-steps li{margin-bottom:3px;}
  .meal-extra-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:8px;
  }
  .hit-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:none;
    background:none;
    padding:0;
    font-size:19px;
    line-height:1;
    cursor:pointer;
    filter:grayscale(1);
    opacity:0.45;
  }
  .hit-btn.active{filter:none;opacity:1;}
  .tag-link{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    text-decoration:underline;
    text-underline-offset:2px;
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
  }
  .meal-note-display{
    font-size:12.5px;
    color:var(--ink-soft);
    font-style:italic;
    margin-top:8px;
    line-height:1.5;
    cursor:pointer;
  }
  .meal-note-edit{margin-top:10px;}
  .meal-note-edit textarea{
    width:100%;
    min-height:60px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px;
    font-size:13px;
    font-family:inherit;
    color:var(--ink);
    background:var(--paper);
    resize:vertical;
    box-sizing:border-box;
  }
  .meal-note-edit-actions{display:flex;gap:8px;margin-top:8px;}
  .meal-btn{
    border:1px solid var(--pantry);
    background:var(--pantry);
    color:#fff;
    font-size:12.5px;
    font-weight:700;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
  }
  .meal-btn.secondary{
    background:var(--card);
    color:var(--ink-soft);
    border-color:var(--line);
  }
  .section-block{margin-top:22px;}
  .shelf-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:5px 10px 4px;
    border-radius:3px;
    margin-bottom:9px;
  }
  .shelf-tag.pantry{background:var(--pantry-soft);color:var(--pantry);}
  .shelf-tag.freezer{background:var(--freezer-soft);color:var(--freezer);}
  .shelf-tag.fridge{background:var(--tag-soft);color:var(--tag);}
  .shelf-tag.household{background:var(--household-soft);color:var(--household);}
  .category-title{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 8px;
  }
  .category-group{margin-bottom:18px;}
  ul.items{list-style:none;margin:0;padding:0;}
  li.item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:7px;
  }
  li.item.zero{opacity:0.45;}
  .item-name{font-size:14.5px;line-height:1.3;}
  .item-controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:2px;
  }
  .stepper button{
    width:28px;
    height:28px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--paper);
    font-size:16px;
    line-height:1;
    color:var(--ink);
    cursor:pointer;
  }
  .qty{
    min-width:26px;
    text-align:center;
    font-variant-numeric:tabular-nums;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    border-bottom:1px dotted var(--ink-soft);
  }
  .qty-input{
    width:48px;
    text-align:center;
    font-variant-numeric:tabular-nums;
    font-weight:700;
    font-size:14.5px;
    font-family:inherit;
    color:var(--ink);
    background:var(--card);
    border:1px solid var(--pantry);
    border-radius:6px;
    padding:3px 2px;
  }
  .qty-input::-webkit-outer-spin-button,
  .qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .qty-input[type=number]{-moz-appearance:textfield;}
  .remove-btn{
    border:none;
    background:none;
    color:var(--ink-soft);
    font-size:16px;
    cursor:pointer;
    padding:4px;
    line-height:1;
  }
  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    padding:50px 20px;
    font-size:14px;
  }
  .add-item-block{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-bottom:14px;
  }
  .add-item-title{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 10px;
    cursor:pointer;
  }
  .add-item-form{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .add-item-form input, .add-item-form select, .add-item-form textarea{
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 10px;
    font-size:14px;
    color:var(--ink);
    background:var(--paper);
    font-family:inherit;
  }
  .add-item-form textarea{
    width:100%;
    font-size:13.5px;
    resize:vertical;
    box-sizing:border-box;
  }
  .add-item-row{display:flex;gap:8px;min-width:0;}
  .add-item-row > *{flex:1;min-width:0;}
  .add-item-row .qty-field{flex:0 1 56px;min-width:40px;}
  .add-item-field{display:flex;flex-direction:column;gap:4px;}
  .field-label{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .category-input-wrap{position:relative;}
  .category-input-wrap input{
    width:100%;
    padding-right:26px;
    box-sizing:border-box;
    /* Always-visible caret, drawn directly on the field so it looks and
       behaves like the Section dropdown's arrow instead of a separate
       button that only rendered on hover. */
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0L5 6L10 0Z' fill='%236E6A5E'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    background-size:10px 6px;
    appearance:none;
    -webkit-appearance:none;
  }
  .add-item-form button{
    margin-top:4px;
    padding:10px;
    border-radius:8px;
    border:1px solid var(--pantry);
    background:var(--pantry);
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .bulk-update-block{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-top:14px;
    margin-bottom:24px;
  }
  .bulk-update-block summary{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
  }
  .bulk-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:10px 0;
    line-height:1.4;
  }
  ul.bulk-hint{
    padding-left:18px;
  }
  ul.bulk-hint li{
    margin-bottom:3px;
  }
  .example-box{
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    padding:9px 10px;
  }
  .example-box-title{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .add-item-form .example-box textarea{
    display:block;
    width:100%;
    border:none;
    background:none;
    padding:0;
    font-size:13.5px;
    color:var(--ink);
    font-family:inherit;
    resize:vertical;
    box-sizing:border-box;
  }
  .add-item-form .example-box textarea:focus{outline:none;}
  .bulk-update-block textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 10px;
    font-size:13.5px;
    color:var(--ink);
    background:var(--paper);
    font-family:inherit;
    resize:vertical;
    box-sizing:border-box;
  }
  .bulk-update-block button{
    margin-top:8px;
    padding:10px;
    width:100%;
    border-radius:8px;
    border:1px solid var(--pantry);
    background:var(--pantry);
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .bulk-update-block button:disabled{opacity:0.6;cursor:default;}
</style>

<body>

<header>
  <h1>Pantry Shelf</h1>
  <input class="search" id="search" type="text" placeholder="Search items…" autocomplete="off">
  <div class="chips">
    <div class="chip active" data-scope="all">All</div>
    <div class="chip" data-scope="pantry">Pantry</div>
    <div class="chip" data-scope="freezer">Freezer</div>
    <div class="chip" data-scope="fridge">Fridge</div>
    <div class="chip" data-scope="household">Household</div>
  </div>
  <div class="sync-status" id="syncStatus"><span class="dot"></span><span id="syncText">Loading…</span></div>
</header>

<main id="main"></main>

<script>
// ==== Backend connection ====
const API_URL = "https://script.google.com/macros/s/AKfycbyHdxJs_bEpXYqxNZwYqGPH58oP8C-MgKfHFzLdLW43ceSs48z4VdDDADJIPBF4IcuasA/exec";

async function apiGet(resource){
  const res = await fetch(API_URL + "?resource=" + encodeURIComponent(resource));
  if(!res.ok) throw new Error("GET " + resource + " failed: " + res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function apiPost(body){
  // Content-Type must stay text/plain — application/json triggers a CORS
  // preflight (OPTIONS request) that Apps Script Web Apps can't answer,
  // which would silently break every save. text/plain keeps this a
  // "simple request" so the browser skips preflight; the body is still
  // valid JSON and is parsed as JSON on the Apps Script side.
  const res = await fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("POST failed: " + res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

// ==== State ====
let items = [];   // [{section, category, item, qty}]
let meals = [];   // [{day, meal, cooked}]  -- this week's plan only, "meal" is just a name
let recipes = [];  // [{name, servings, ingredients: [...], steps: [...], note, lastCooked, favorite}]  -- permanent library
let activeScope = "all";
let query = "";
let suppressPollUntil = 0; // skip the next poll right after a local save, to avoid a race overwriting an in-flight edit
let expandedMealDays = new Set(); // which meal recipe panels are open — persists across re-renders
let editingNoteDay = null; // which meal's note editor is open, if any (only one at a time)
let mealsExpanded = true; // whether the whole "This Week's Meals" section is open — persists across re-renders
let addItemsExpanded = false; // whether the "Add Items" section is open — persists across re-renders
let mealsImportExpanded = false; // whether "Update This Week's Meals" is open — persists across re-renders
let purchasesImportExpanded = false; // whether "Log a Grocery Purchase" is open — persists across re-renders
let actionsMenuOpen = false; // whether the "Actions" dropdown menu is open — persists across re-renders

// The app's four browsing sections and their display labels — used for the
// filter chips, the shelf tags above each group of items, and the Section
// dropdown in Add Items. Adding a new section later just means adding it
// here (plus a matching CSS color and chip in the header markup).
const SECTIONS = ["pantry", "freezer", "fridge", "household"];
const SECTION_LABELS = {pantry: "Pantry", freezer: "Freezer", fridge: "Fridge", household: "Household"};

// Splits a recipe's Ingredients/Steps cell into a list. Accepts either a
// real newline between items (how early recipes were entered, e.g. via CSV
// import) or a " | " delimiter on a single line (the preferred format now —
// far easier to type into a single Sheets cell, by hand or via automation,
// since it needs no special line-break keystroke).
function linesToArray(text){
  return String(text || "").split(/\n|\s*\|\s*/).map(l => l.trim()).filter(Boolean);
}

// Parses a pasted weekly meal plan — the format Claude outputs in chat when
// it finalizes a plan. Lets a whole week get typed/pasted in from anywhere
// (a phone included) with no Sheet or backend access needed on the writing
// end at all — the page itself does the writing once this is submitted.
//   Day: Monday
//   Name: Sheet-Pan Salmon with Green Beans & Rice
//   Servings: 4
//   Ingredients:
//   - 1 lb salmon fillet
//   - 1 cup jasmine rice
//   Steps:
//   1. Preheat oven to 400°F.
//   2. Roast salmon 12-15 min until it flakes easily.
//   Note: optional tip
//   ---
//   Day: Tuesday
//   ...
// Only "Day:" and "Name:" are required per block — Servings/Ingredients/
// Steps/Note are all optional, so a block that's just a Day+Name (pointing
// at an existing recipe already in the library) leaves that recipe's row
// untouched instead of blanking it out.
function parseMealPlanText(text){
  const lines = String(text || "").split("\n").map(l => l.replace(/\r$/, ""));
  const meals = [];
  let current = null;
  let section = null; // "ingredients" | "steps" | null

  function pushCurrent(){ if(current && current.day) meals.push(current); }

  lines.forEach(rawLine => {
    const line = rawLine.trim();
    if(!line || line === "---") return;
    const m = (label) => line.toLowerCase().startsWith(label.toLowerCase() + ":");
    const valueAfter = (label) => line.slice(label.length + 1).trim();

    if(m("Day")){
      pushCurrent();
      current = {day: valueAfter("Day"), name: "", servings: "", ingredients: [], steps: [], note: ""};
      section = null;
    } else if(!current){
      // ignore stray lines before the first "Day:"
    } else if(m("Name")){
      current.name = valueAfter("Name");
    } else if(m("Servings")){
      current.servings = valueAfter("Servings");
    } else if(m("Ingredients")){
      section = "ingredients";
    } else if(m("Steps")){
      section = "steps";
    } else if(m("Note")){
      current.note = valueAfter("Note");
      section = null;
    } else if(section === "ingredients" && /^[-•]\s*/.test(line)){
      current.ingredients.push(line.replace(/^[-•]\s*/, "").trim());
    } else if(section === "steps" && /^\d+[.)]\s*/.test(line)){
      current.steps.push(line.replace(/^\d+[.)]\s*/, "").trim());
    }
  });
  pushCurrent();

  return meals;
}

// Parses a pasted grocery receipt — the format Claude outputs after reading
// a screenshot. A "Date:"/"Store:" pair applies to every item line that
// follows, until the next "Date:" line starts a new receipt (so more than
// one receipt can be pasted in at once). Each item line is single-line and
// pipe-delimited: Item | Qty | Price | Section | Category.
//   Date: 2026-08-20
//   Store: Walmart
//   Friendly Farms Milk (1 gal) | 1 | 3.55 | fridge | Dairy
//   Great Value Mayonnaise (30 fl oz) | 1 | 2.97 | pantry | Condiments & Sauces
//   Date: 2026-08-08
//   Store: ALDI
//   General Mills Cinnamon Toast Crunch | 1 | 4.39 | pantry | Cereal & Breakfast
function parsePurchasesText(text){
  const lines = String(text || "").split("\n").map(l => l.replace(/\r$/, ""));
  const purchases = [];
  let currentDate = "", currentStore = "";

  lines.forEach(rawLine => {
    const line = rawLine.trim();
    if(!line) return;
    const m = (label) => line.toLowerCase().startsWith(label.toLowerCase() + ":");
    const valueAfter = (label) => line.slice(label.length + 1).trim();

    if(m("Date")){
      currentDate = valueAfter("Date");
    } else if(m("Store")){
      currentStore = valueAfter("Store");
    } else if(line.includes("|")){
      const parts = line.split("|").map(p => p.trim());
      const [item, qty, price, section, category] = parts;
      if(item){
        purchases.push({
          date: currentDate, store: currentStore,
          item, qty: qty || "", price: price || "",
          section: (section || "").toLowerCase(), category: category || ""
        });
      }
    }
    // any other stray line (blank, unrecognized) is just ignored
  });

  return purchases;
}

function setSyncStatus(mode, text){
  const el = document.getElementById("syncStatus");
  const txt = document.getElementById("syncText");
  el.className = "sync-status " + mode;
  txt.textContent = text;
}

// ==== Loading ====
async function loadAll(isBackgroundPoll){
  if(isBackgroundPoll && Date.now() < suppressPollUntil) return;
  try{
    const [freshItems, freshMeals, freshRecipes] = await Promise.all([apiGet("items"), apiGet("meals"), apiGet("recipes")]);
    // section is matched case/whitespace-insensitively so it doesn't matter how it was typed in the sheet
    items = freshItems.map(it => ({section: String(it.section || "").trim().toLowerCase(), category: String(it.category || "").trim(), item: String(it.item || "").trim(), qty: Number(it.qty) || 0}));
    meals = freshMeals.map(m => ({
      day: m.day,
      meal: m.meal,
      cooked: String(m.cooked).trim().toLowerCase() === "true"
    }));
    recipes = freshRecipes.map(r => ({
      name: String(r.name || "").trim(),
      servings: String(r.servings || "").trim(),
      ingredients: linesToArray(r.ingredients),
      steps: linesToArray(r.steps),
      note: String(r.note || "").trim(),
      lastCooked: String(r.lastCooked || "").trim(),
      favorite: String(r.favorite).trim().toLowerCase() === "true"
    }));
    setSyncStatus("ok", "Synced");
    render();
  }catch(err){
    setSyncStatus("error", "Couldn't load — check your connection");
    if(!isBackgroundPoll) render(); // still render an empty state rather than a blank page
  }
}

// ==== Saving ====
async function saveItemQty(it){
  setSyncStatus("saving", "Saving…");
  try{
    await apiPost({resource:"items", action:"upsert", section: it.section, category: it.category, item: it.item, qty: it.qty});
    suppressPollUntil = Date.now() + 4000;
    setSyncStatus("ok", "Synced");

}

async function deleteItem(it){
  items = items.filter(x => x !== it);
  render();
  setSyncStatus("saving", "Saving…");
  try{
    await apiPost({resource:"items", action:"delete", section: it.section, category: it.category, item: it.item});
    suppressPollUntil = Date.now() + 4000;
    setSyncStatus("ok", "Synced");
  }catch(err){
    setSyncStatus("error", "Delete failed — try again");
  }
}

async function saveMeal(m){
  setSyncStatus("saving", "Saving…");
  try{
    await apiPost({resource:"meals", action:"upsert", day: m.day, meal: m.meal, cooked: m.cooked});
    suppressPollUntil = Date.now() + 4000;
    setSyncStatus("ok", "Synced");
  }catch(err){
    setSyncStatus("error", "Save failed — try again");
  }
}

function findRecipe(name){
  const key = String(name || "").trim().toLowerCase();
  if(!key) return null;
  return recipes.find(r => r.name.toLowerCase() === key) || null;
}

// Stamps today's date on check, and remembers what Last Cooked was before the
// stamp so an uncheck (revertLastCooked, below) can put it back. This memory
// is kept on the meal object in memory only — it doesn't survive a page
// reload, since the sheet only ever stores a single Last Cooked value, not a
// history. Reverting after a reload just clears the date instead.
async function stampLastCooked(m){
  const mealName = m.meal.trim();
  const recipe = findRecipe(mealName);
  m.previousLastCooked = recipe ? recipe.lastCooked : "";
  const today = new Date().toISOString().slice(0, 10); // YYYY-MM-DD, local browser clock
  try{
    await apiPost({resource:"recipes", action:"upsert", name: mealName, lastCooked: today});
    if(recipe){
      recipe.lastCooked = today;
      render();
    }
  }catch(err){
    // The Cooked checkbox itself already saved fine, so this stays non-blocking —
    // but surface it instead of failing silently, so a real problem is visible
    // instead of just looking like nothing happened.
    console.error("stampLastCooked failed for \"" + mealName + "\":", err);
    setSyncStatus("error", "Cooked, but Last Cooked date failed to save");
  }
}

// Undoes stampLastCooked when a meal is un-checked — restores whatever Last
// Cooked held right before it was stamped (blank, if this is the recipe's
// first-ever cook, or an earlier date if it had one).
async function revertLastCooked(m){
  const mealName = m.meal.trim();
  const prev = m.previousLastCooked !== undefined ? m.previousLastCooked : "";
  try{
    await apiPost({resource:"recipes", action:"upsert", name: mealName, lastCooked: prev});
    const recipe = findRecipe(mealName);
    if(recipe){
      recipe.lastCooked = prev;
      render();
    }
  }catch(err){
    console.error("revertLastCooked failed for \"" + mealName + "\":", err);
    setSyncStatus("error", "Un-cooked, but Last Cooked date failed to revert");
  }
  delete m.previousLastCooked;
}

// Toggles the thumbs-up "favorite" mark for a meal's recipe. Writes straight
// to the Recipes tab, so it (like the note) sticks around across visits and
// devices instead of resetting per session.
async function saveFavorite(m){
  const mealName = m.meal.trim();
  if(!mealName) return;
  const recipe = findRecipe(mealName);
  const newValue = !(recipe && recipe.favorite);
  try{
    // Write "" rather than false when un-favoriting, so the cell goes back to
    // blank instead of showing the literal text FALSE — matching how Note and
    // Last Cooked already behave when they're unset.
    await apiPost({resource:"recipes", action:"upsert", name: mealName, favorite: newValue ? true : ""});
    if(recipe){
      recipe.favorite = newValue;
    } else {
      recipes.push({name: mealName, servings:"", ingredients:[], steps:[], note:"", lastCooked:"", favorite:newValue});
    }
    render();
  }catch(err){
    console.error("saveFavorite failed for \"" + mealName + "\":", err);
    setSyncStatus("error", "Favorite mark failed to save");
  }
}

// Saves a free-text note for a meal's recipe straight to the Recipes tab's
// Note column — same field the recipe panel already reads from.
async function saveNote(m, noteText){
  const mealName = m.meal.trim();
  if(!mealName) return;
  const trimmed = noteText.trim();
  const recipe = findRecipe(mealName);
  try{
    await apiPost({resource:"recipes", action:"upsert", name: mealName, note: trimmed});
    if(recipe){
      recipe.note = trimmed;
    } else {
      recipes.push({name: mealName, servings:"", ingredients:[], steps:[], note: trimmed, lastCooked:"", favorite:false});
    }
    editingNoteDay = null;
    render();
  }catch(err){
    console.error("saveNote failed for \"" + mealName + "\":", err);
    setSyncStatus("error", "Note failed to save");
  }
}

// ==== Rendering ====
function render(){
  const main = document.getElementById("main");
  main.innerHTML = "";

  renderActionsBar(main);
  if(addItemsExpanded) renderAddItemForm(main);
  if(purchasesImportExpanded) renderPurchasesImport(main);
  if(mealsImportExpanded) renderMealsImport(main);

  const divider = document.createElement("div");
  divider.className = "content-divider";
  main.appendChild(divider);

  if(!query.trim()) renderMeals(main);
  renderItems(main);
}

// The "Actions" menu is a directory to the app's other modules (Add Items,
// Log a Grocery Purchase, Update This Week's Meals) — tucked away here
// instead of sitting inline as separate cards, so the page opens straight
// to This Week's Meals and the pantry list. Picking a menu item just opens
// that module's existing collapsible panel (same state vars/persistence as
// before) and scrolls to it; the menu itself closes right after.
function renderActionsBar(container){
  const bar = document.createElement("div");
  bar.className = "actions-bar";

  const toggle = document.createElement("div");
  toggle.className = "actions-toggle";
  const label = document.createElement("span");
  label.textContent = "Actions";
  toggle.appendChild(label);
  const chevron = document.createElement("span");
  chevron.className = "chevron" + (actionsMenuOpen ? " open" : "");
  chevron.textContent = "▾";
  toggle.appendChild(chevron);
  toggle.onclick = () => { actionsMenuOpen = !actionsMenuOpen; render(); };
  bar.appendChild(toggle);

  const menu = document.createElement("div");
  menu.className = "actions-menu" + (actionsMenuOpen ? " open" : "");

  const modules = [
    {label: "Add Items", blockId: "addItemsBlock", open: () => { addItemsExpanded = true; }},
    {label: "Log a Grocery Purchase", blockId: "purchasesImportBlock", open: () => { purchasesImportExpanded = true; }},
    {label: "Update This Week's Meals", blockId: "mealsImportBlock", open: () => { mealsImportExpanded = true; }}
  ];
  modules.forEach(mod => {
    const item = document.createElement("button");
    item.className = "actions-menu-item";
    item.textContent = mod.label;
    item.onclick = () => {
      mod.open();
      actionsMenuOpen = false;
      render();
      const el = document.getElementById(mod.blockId);
      if(el) el.scrollIntoView({behavior: "smooth", block: "start"});
    };
    menu.appendChild(item);
  });
  bar.appendChild(menu);

  container.appendChild(bar);
}

function renderMeals(container){
  if(meals.length === 0) return;
  const block = document.createElement("details");
  block.className = "meals-block";
  block.open = mealsExpanded;
  block.addEventListener("toggle", () => { mealsExpanded = block.open; });

  const title = document.createElement("summary");
  title.className = "meals-title";
  title.textContent = "This Week's Meals";
  block.appendChild(title);

  meals.forEach(m => {
    const card = document.createElement("div");
    card.className = "meal-card";

    const day = document.createElement("div");
    day.className = "meal-day";
    day.textContent = m.day;
    card.appendChild(day);

    const row = document.createElement("div");
    row.className = "meal-row";

    const input = document.createElement("input");
    input.className = "meal-name-input" + (m.cooked ? " cooked" : "");
    input.type = "text";
    input.value = m.meal;
    input.addEventListener("change", () => {
      m.meal = input.value.trim();
      saveMeal(m);
    });
    row.appendChild(input);

    const label = document.createElement("label");
    label.className = "meal-cooked-label";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = m.cooked;
    checkbox.addEventListener("change", () => {
      const becomingCooked = checkbox.checked && !m.cooked;
      const becomingUncooked = !checkbox.checked && m.cooked;
      m.cooked = checkbox.checked;
      input.className = "meal-name-input" + (m.cooked ? " cooked" : "");
      saveMeal(m);
      if(becomingCooked && m.meal.trim()) stampLastCooked(m);
      if(becomingUncooked && m.meal.trim()) revertLastCooked(m);
    });
    label.appendChild(checkbox);
    label.appendChild(document.createTextNode("Cooked"));
    row.appendChild(label);

    card.appendChild(row);

    const recipe = findRecipe(m.meal);
    // "hasRecipe" covers ANY recorded info, not just full ingredients/steps —
    // otherwise a Last Cooked stamp, a favorite, or a note on a meal with no
    // full recipe attached yet would silently never show.
    const hasRecipe = !!recipe && (recipe.servings || recipe.ingredients.length > 0 || recipe.steps.length > 0 || recipe.note || recipe.lastCooked || recipe.favorite);
    const isOpen = expandedMealDays.has(m.day);

    const toggleRow = document.createElement("div");
    toggleRow.className = "recipe-toggle-row";
    const link = document.createElement("button");
    link.className = "recipe-link";
    link.textContent = isOpen ? "Hide recipe ▲" : (hasRecipe ? "View recipe ▼" : "No recipe yet ▼");
    link.onclick = () => {
      if(expandedMealDays.has(m.day)) expandedMealDays.delete(m.day);
      else expandedMealDays.add(m.day);
      render();
    };
    toggleRow.appendChild(link);
    card.appendChild(toggleRow);

    if(isOpen){
      const recipeEl = document.createElement("div");
      recipeEl.className = "meal-recipe";

      if(!hasRecipe){
        const empty = document.createElement("div");
        empty.className = "meal-recipe-empty";
        empty.textContent = "No recipe saved for this meal yet.";
        recipeEl.appendChild(empty);
      } else {
        if(recipe.servings){
          const servings = document.createElement("div");
          servings.className = "meal-servings";
          servings.textContent = "Serves " + recipe.servings;
          recipeEl.appendChild(servings);
        }
        if(recipe.lastCooked){
          const last = document.createElement("div");
          last.className = "meal-last-cooked";
          last.textContent = "Last cooked: " + recipe.lastCooked;
          recipeEl.appendChild(last);
        }
        if(recipe.ingredients.length){
          const ingTitle = document.createElement("div");
          ingTitle.className = "meal-recipe-subtitle";
          ingTitle.textContent = "Ingredients";
          recipeEl.appendChild(ingTitle);
          const ul = document.createElement("ul");
          ul.className = "meal-ingredients";
          recipe.ingredients.forEach(line => {
            const li = document.createElement("li");
            li.textContent = line;
            ul.appendChild(li);
          });
          recipeEl.appendChild(ul);
        }
        if(recipe.steps.length){
          const stepsTitle = document.createElement("div");
          stepsTitle.className = "meal-recipe-subtitle";
          stepsTitle.textContent = "Steps";
          recipeEl.appendChild(stepsTitle);
          const ol = document.createElement("ol");
          ol.className = "meal-steps";
          recipe.steps.forEach(line => {
            const li = document.createElement("li");
            li.textContent = line;
            ol.appendChild(li);
          });
          recipeEl.appendChild(ol);
        }
      }

      card.appendChild(recipeEl);
    }

    // Thumbs-up + note — both write straight to this meal's Recipes row, so
    // they persist across visits/devices like Last Cooked already does.
    const extraRow = document.createElement("div");
    extraRow.className = "meal-extra-row";

    const isFavorite = !!(recipe && recipe.favorite);
    const hitBtn = document.createElement("button");
    hitBtn.className = "hit-btn" + (isFavorite ? " active" : "");
    hitBtn.textContent = "👍";
    hitBtn.title = isFavorite ? "Marked as a hit" : "Mark as a hit";
    hitBtn.onclick = () => saveFavorite(m);
    extraRow.appendChild(hitBtn);

    const currentNote = recipe ? recipe.note : "";
    const noteLink = document.createElement("button");
    noteLink.className = "tag-link";
    noteLink.textContent = currentNote ? "Edit note" : "+ Add note";
    noteLink.onclick = () => {
      editingNoteDay = editingNoteDay === m.day ? null : m.day;
      render();
    };
    extraRow.appendChild(noteLink);

    card.appendChild(extraRow);

    if(currentNote && editingNoteDay !== m.day){
      const noteDisplay = document.createElement("div");
      noteDisplay.className = "meal-note-display";
      noteDisplay.textContent = "“" + currentNote + "”";
      noteDisplay.onclick = () => { editingNoteDay = m.day; render(); };
      card.appendChild(noteDisplay);
    }

    if(editingNoteDay === m.day){
      const noteEdit = document.createElement("div");
      noteEdit.className = "meal-note-edit";

      const textarea = document.createElement("textarea");
      textarea.placeholder = "e.g. \"Kids loved this, but go lighter on the cumin next time.\"";
      textarea.value = currentNote;
      noteEdit.appendChild(textarea);

      const noteActions = document.createElement("div");
      noteActions.className = "meal-note-edit-actions";

      const saveNoteBtn = document.createElement("button");
      saveNoteBtn.className = "meal-btn";
      saveNoteBtn.textContent = "Save";
      saveNoteBtn.onclick = () => saveNote(m, textarea.value);
      noteActions.appendChild(saveNoteBtn);

      const cancelNoteBtn = document.createElement("button");
      cancelNoteBtn.className = "meal-btn secondary";
      cancelNoteBtn.textContent = "Cancel";
      cancelNoteBtn.onclick = () => { editingNoteDay = null; render(); };
      noteActions.appendChild(cancelNoteBtn);

      noteEdit.appendChild(noteActions);
      card.appendChild(noteEdit);
    }

    block.appendChild(card);
  });

  container.appendChild(block);
}

function renderMealsImport(container){
  const block = document.createElement("details");
  block.id = "mealsImportBlock";
  block.className = "bulk-update-block";
  block.open = mealsImportExpanded;
  block.addEventListener("toggle", () => { mealsImportExpanded = block.open; });

  const summary = document.createElement("summary");
  summary.textContent = "Update This Week's Meals";
  block.appendChild(summary);

  const hint = document.createElement("div");
  hint.className = "bulk-hint";
  hint.textContent = 'Paste the meal plan Claude gave you in chat — each day gets written straight to the sheet, no laptop needed. Format per day: "Day: Monday" then "Name: …", and optionally "Servings:", "Ingredients:" (lines starting with -), "Steps:" (lines starting with a number), and "Note:" — separate days with a line containing just "---". A day with just Day/Name (pointing at a recipe already in the library) leaves that recipe untouched.';
  block.appendChild(hint);

  const textarea = document.createElement("textarea");
  textarea.rows = 10;
  textarea.placeholder = "Day: Monday\nName: Sheet-Pan Salmon with Green Beans & Rice\nServings: 4\nIngredients:\n- 1 lb salmon fillet\n- 1 cup jasmine rice\nSteps:\n1. Preheat oven to 400°F.\n2. Roast salmon 12-15 min until it flakes easily.\nNote:\n---\nDay: Tuesday\n…";
  block.appendChild(textarea);

  const applyBtn = document.createElement("button");
  applyBtn.textContent = "Update meal plan";
  block.appendChild(applyBtn);

  applyBtn.onclick = async () => {
    const parsed = parseMealPlanText(textarea.value);
    if(!parsed.length){
      alert('Couldn\'t find any meals in that text — check it matches the "Day: …" / "Name: …" format and try again.');
      return;
    }

    applyBtn.disabled = true;
    for(let i = 0; i < parsed.length; i++){
      const p = parsed[i];
      applyBtn.textContent = "Updating… (" + (i + 1) + "/" + parsed.length + ")";
      setSyncStatus("saving", "Saving…");
      try{
        await apiPost({resource: "meals", action: "upsert", day: p.day, meal: p.name, cooked: false});
        const hasRecipeInfo = p.servings || p.ingredients.length || p.steps.length || p.note;
        if(p.name && hasRecipeInfo){
          const recipeBody = {resource: "recipes", action: "upsert", name: p.name};
          if(p.servings) recipeBody.servings = p.servings;
          if(p.ingredients.length) recipeBody.ingredients = p.ingredients.join(" | ");
          if(p.steps.length) recipeBody.steps = p.steps.join(" | ");
          if(p.note) recipeBody.note = p.note;
          await apiPost(recipeBody);
        }
      }catch(err){
        console.error("Meal plan import failed on \"" + p.day + "\":", err);
        setSyncStatus("error", "Import failed partway — check the sheet");
        alert("Something went wrong updating " + p.day + ": " + err.message + "\n\nDays before this one in the list were likely already saved — check the sheet before pasting again, to avoid double-writing them.");
        applyBtn.disabled = false;
        applyBtn.textContent = "Update meal plan";
        return;
      }
    }

    applyBtn.disabled = false;
    applyBtn.textContent = "Update meal plan";
    textarea.value = "";
    suppressPollUntil = Date.now() + 4000;
    setSyncStatus("ok", "Synced");
    await loadAll();
    alert("Updated " + parsed.length + " day" + (parsed.length === 1 ? "" : "s") + ".");
  };

  container.appendChild(block);
}

function renderItems(container){
  const sections = activeScope === "all" ? SECTIONS : [activeScope];
  const q = query.trim().toLowerCase();
  let totalShown = 0;

  sections.forEach(section => {
    const sectionItems = items.filter(it => it.section === section && (!q || it.item.toLowerCase().includes(q)));
    if(sectionItems.length === 0) return;

    const block = document.createElement("div");
    block.className = "section-block";

    const tag = document.createElement("div");
    tag.className = "shelf-tag " + section;
    tag.textContent = SECTION_LABELS[section] || section;
    block.appendChild(tag);

    // group categories case/whitespace-insensitively, but display using the first-seen casing
    const catDisplay = new Map(); // lowercase key -> display label
    sectionItems.forEach(it => {
      const key = it.category.toLowerCase();
      if(!catDisplay.has(key)) catDisplay.set(key, it.category);
    });

    catDisplay.forEach((category, key) => {
      const catItems = sectionItems.filter(it => it.category.toLowerCase() === key);
      totalShown += catItems.length;

      const catWrap = document.createElement("div");
      catWrap.className = "category-group";

      const catTitle = document.createElement("div");
      catTitle.className = "category-title";
      catTitle.textContent = category;
      catWrap.appendChild(catTitle);

      const ul = document.createElement("ul");
      ul.className = "items";

      catItems.forEach(it => {
        const li = document.createElement("li");
        li.className = "item" + (it.qty === 0 ? " zero" : "");

        const name = document.createElement("div");
        name.className = "item-name";
        name.textContent = it.item;
        li.appendChild(name);

        const controls = document.createElement("div");
        controls.className = "item-controls";

        const stepper = document.createElement("div");
        stepper.className = "stepper";
        const minus = document.createElement("button");
        minus.textContent = "–";
        minus.onclick = () => { it.qty = Math.max(0, Math.round((it.qty - 1) * 100) / 100); saveItemQty(it); render(); };
        const qtyEl = document.createElement("div");
        qtyEl.className = "qty";
        qtyEl.textContent = it.qty;
        qtyEl.title = "Tap to type an exact quantity";
        qtyEl.onclick = () => {
          const input = document.createElement("input");
          input.type = "number";
          input.className = "qty-input";
          input.min = "0";
          input.step = "any";
          input.value = it.qty;
          qtyEl.replaceWith(input);
          input.focus();
          input.select();

          let committed = false;
          const commit = () => {
            if(committed) return;
            committed = true;
            const val = parseFloat(input.value);
            it.qty = isNaN(val) ? it.qty : Math.max(0, Math.round(val * 100) / 100);
            saveItemQty(it);
            render();
          };
          input.addEventListener("blur", commit);
          input.addEventListener("keydown", (e) => {
            if(e.key === "Enter") input.blur();
            if(e.key === "Escape"){ committed = true; render(); }
          });
        };
        const plus = document.createElement("button");
        plus.textContent = "+";
        plus.onclick = () => { it.qty = Math.round((it.qty + 1) * 100) / 100; saveItemQty(it); render(); };
        stepper.appendChild(minus);
        stepper.appendChild(qtyEl);
        stepper.appendChild(plus);
        controls.appendChild(stepper);

        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-btn";
        removeBtn.textContent = "✕";
        removeBtn.title = "Remove item";
        removeBtn.onclick = () => {
          if(confirm('Remove "' + it.item + '" from the list entirely?')) deleteItem(it);
        };
        controls.appendChild(removeBtn);

        li.appendChild(controls);
        ul.appendChild(li);
      });

      catWrap.appendChild(ul);
      block.appendChild(catWrap);
    });

    container.appendChild(block);
  });

  if(totalShown === 0){
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = q ? "No items match your search." : "No items here yet — add one below.";
    container.appendChild(empty);
  }
}

// Add an Item, and Bulk Update from a list, used to be two separate
// features — one gave you real section/category controls but only one item
// at a time, the other let you paste many lines at once but had no way to
// place a new item anywhere but Pantry/Uncategorized. This merges them:
// the Section/Category fields set the DEFAULT for every line below, and any
// line can override that default for itself with "| section | category".
function renderAddItemForm(container){
  const block = document.createElement("details");
  block.id = "addItemsBlock";
  block.className = "add-item-block";
  block.open = addItemsExpanded;
  block.addEventListener("toggle", () => { addItemsExpanded = block.open; });

  const title = document.createElement("summary");
  title.className = "add-item-title";
  title.textContent = "Add Items";
  block.appendChild(title);

  const form = document.createElement("div");
  form.className = "add-item-form";

  const row = document.createElement("div");
  row.className = "add-item-row";

  const sectionField = document.createElement("div");
  sectionField.className = "add-item-field";
  const sectionLabel = document.createElement("label");
  sectionLabel.className = "field-label";
  sectionLabel.textContent = "Section";
  sectionField.appendChild(sectionLabel);
  const sectionSelect = document.createElement("select");
  sectionSelect.title = "Default section for lines below that don't specify their own";
  SECTIONS.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = SECTION_LABELS[s] || s;
    sectionSelect.appendChild(opt);
  });
  sectionField.appendChild(sectionSelect);
  row.appendChild(sectionField);

  const categoryField = document.createElement("div");
  categoryField.className = "add-item-field";
  const categoryLabel = document.createElement("label");
  categoryLabel.className = "field-label";
  categoryLabel.textContent = "Category";
  categoryField.appendChild(categoryLabel);
  const categoryWrap = document.createElement("div");
  categoryWrap.className = "category-input-wrap";
  const categoryInput = document.createElement("input");
  categoryInput.type = "text";
  categoryInput.placeholder = "Default category";
  categoryInput.setAttribute("list", "categoryOptions");
  // Clicking anywhere in the field opens the full category list, the same
  // way clicking the Section dropdown opens its list — showPicker() shows
  // every option regardless of what's already typed; where it's
  // unsupported, focusing the field still surfaces matching suggestions.
  categoryInput.addEventListener("click", () => {
    if(typeof categoryInput.showPicker === "function"){
      try{ categoryInput.showPicker(); }catch(e){ /* unsupported here — it's already focused */ }
    }
  });
  categoryWrap.appendChild(categoryInput);
  categoryField.appendChild(categoryWrap);
  row.appendChild(categoryField);

  form.appendChild(row);

  const datalist = document.createElement("datalist");
  datalist.id = "categoryOptions";
  const catOptions = new Map(); // lowercase key -> display label, dedup case-insensitively
  items.forEach(it => {
    const key = it.category.toLowerCase();
    if(!catOptions.has(key)) catOptions.set(key, it.category);
  });
  catOptions.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    datalist.appendChild(opt);
  });
  form.appendChild(datalist);

  const hint = document.createElement("ul");
  hint.className = "bulk-hint";
  const hintPoint1 = document.createElement("li");
  hintPoint1.textContent = 'Adding one item will use the "Section" and "Category" fields above.';
  hint.appendChild(hintPoint1);
  const hintPoint2 = document.createElement("li");
  hintPoint2.textContent = "Adding multiple items requires using one of the formats listed below.";
  hint.appendChild(hintPoint2);
  form.appendChild(hint);

  // A real title element (not just the first placeholder line) so it can
  // look distinct — bold, small-caps — instead of blending into the
  // examples below it in the placeholder's plain, uniform gray text.
  const exampleBox = document.createElement("div");
  exampleBox.className = "example-box";

  const exampleTitle = document.createElement("div");
  exampleTitle.className = "example-box-title";
  exampleTitle.textContent = "Example Formats:";
  exampleBox.appendChild(exampleTitle);

  const textarea = document.createElement("textarea");
  textarea.rows = 4;
  textarea.placeholder = "Great Value Diced Tomatoes: 3\nFriendly Farms Milk (1 gal)\nNew Frozen Item: 2 | freezer | Meat & Poultry";
  exampleBox.appendChild(textarea);

  form.appendChild(exampleBox);

  const addBtn = document.createElement("button");
  addBtn.textContent = "Add items";
  addBtn.onclick = async () => {
    const lines = textarea.value.split("\n").map(l => l.trim()).filter(Boolean);
    if(!lines.length) return;

    const defaultSection = sectionSelect.value;
    const defaultCategory = categoryInput.value.trim();

    addBtn.disabled = true;
    let added = 0, updated = 0;
    const skipped = [];

    for(let i = 0; i < lines.length; i++){
      addBtn.textContent = "Adding… (" + (i + 1) + "/" + lines.length + ")";
      const line = lines[i];
      const idx = line.indexOf(":");
      const name = (idx === -1 ? line : line.slice(0, idx)).trim();
      if(!name){ skipped.push(line + " — couldn't read an item name"); continue; }

      // Everything after the ":" is quantity (optional, defaults to 1),
      // optionally followed by "| section | category" to override the
      // defaults above for just this line.
      const restParts = (idx === -1 ? "" : line.slice(idx + 1)).trim().split("|").map(p => p.trim());
      const qty = restParts[0] ? parseFloat(restParts[0]) : 1;
      if(isNaN(qty)){ skipped.push(line + " — couldn't read a quantity"); continue; }
      const section = (restParts[1] || defaultSection).toLowerCase();
      const category = restParts[2] || defaultCategory || "Uncategorized";

      let matches = items.filter(it => it.item.toLowerCase() === name.toLowerCase());
      if(matches.length > 1){
        // an explicit or default section/category can disambiguate two same-named items
        const narrowed = matches.filter(it => it.section === section && it.category.toLowerCase() === category.toLowerCase());
        if(narrowed.length === 1) matches = narrowed;
      }
      if(matches.length > 1){ skipped.push(name + " — matches more than one item; add \"| section | category\" to specify which, or update by hand"); continue; }

      const cleanQty = Math.max(0, Math.round(qty * 100) / 100);
      if(matches.length === 1){
        matches[0].qty = cleanQty;
        await saveItemQty(matches[0]);
        updated++;
      } else {
        const newItem = {section, category, item: name, qty: cleanQty};
        items.push(newItem);
        await saveItemQty(newItem);
        added++;
      }
    }

    addBtn.disabled = false;
    addBtn.textContent = "Add items";
    textarea.value = "";

    let msg = added + " added, " + updated + " updated";
    if(skipped.length) msg += ", " + skipped.length + " skipped:\n" + skipped.join("\n");
    else msg += ".";
    alert(msg);
    render();
  };
  form.appendChild(addBtn);

  block.appendChild(form);
  container.appendChild(block);
}

// ==== Controls ====
document.getElementById("search").addEventListener("input", (e) => {
  query = e.target.value;
  render();
});

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    activeScope = chip.dataset.scope;
    render();
  });
});

// ==== Init ====
loadAll();
setInterval(() => loadAll(true), 20000);
</script>
